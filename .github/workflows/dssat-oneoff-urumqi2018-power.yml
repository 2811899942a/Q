name: DSSAT One-off Urumqi 2018 POWER Fetch
on:
  push:
    branches: [research/dssat-regional-dtr-joint-v1]
    paths:
      - '.github/workflows/dssat-oneoff-urumqi2018-power.yml'
permissions:
  contents: read
jobs:
  fetch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/dssat-regional-dtr-joint-v1
      - name: Fetch 2018 radiation and precipitation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/urumqi2018
          URL='https://power.larc.nasa.gov/api/temporal/daily/point?parameters=ALLSKY_SFC_SW_DWN,PRECTOTCORR&community=AG&longitude=87.616667&latitude=43.783333&start=20180101&end=20181231&format=JSON'
          curl -fL --retry 3 --retry-delay 2 "$URL" -o /tmp/urumqi2018/urumqi_power_2018.json
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          p=Path('/tmp/urumqi2018/urumqi_power_2018.json')
          d=json.loads(p.read_text())['properties']['parameter']
          s=d['ALLSKY_SFC_SW_DWN']; r=d['PRECTOTCORR']
          valid=[k for k in s if s[k]>-900 and r.get(k,-999)>-900]
          assert len(valid)>=365
          Path('/tmp/urumqi2018/manifest.txt').write_text(
            'source=NASA POWER Daily API\nlocation=43.783333N,87.616667E\nperiod=2018-01-01..2018-12-31\nparameters=ALLSKY_SFC_SW_DWN,PRECTOTCORR\n'
            f'valid_days={len(valid)}\nsha256={hashlib.sha256(p.read_bytes()).hexdigest()}\n')
          print(Path('/tmp/urumqi2018/manifest.txt').read_text())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: urumqi-power-2018-${{ github.run_id }}
          path: /tmp/urumqi2018
          retention-days: 3
          if-no-files-found: error

name: Anningqu H0TT Fast Causal V2

on:
  push:
    branches: [research/dssat-dtr-matrix]
    paths:
      - '.github/workflows/anningqu-h0tt-causal-fast-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  h0tt_v2:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/dssat-dtr-matrix
          fetch-depth: 0
      - name: Build official-HMET TGRO coupling arm
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y gfortran cmake make
          git clone -q https://github.com/DSSAT/dssat-csm-os.git /tmp/os
          git -C /tmp/os checkout -q 0b91373806786b600d89ccfcfff78fa2f82cb26b
          git clone -q https://github.com/DSSAT/dssat-csm-data.git /tmp/data
          git -C /tmp/data checkout -q 79cb5db71bbca186add92a6a9695866a09c8b51d
          python research/dssat_dtr/dssat485/apply_extreme_dtt_tgro_patch.py /tmp/os
          cmake -S /tmp/os -B /tmp/build -DCMAKE_BUILD_TYPE=RELEASE -DCMAKE_INSTALL_PREFIX=/tmp/run >/dev/null
          cmake --build /tmp/build --parallel 2 >/dev/null
          cmake --install /tmp/build >/dev/null
          cp -a /tmp/data/. /tmp/run/
      - name: Run 10 H0TT real DSSAT cases
        run: |
          set -euo pipefail
          R=/tmp/run
          cp research/dssat_dtr/data/anningqu/formal_ghcn_rain/ANQH2101.WTH "$R/Weather/ANQH2101.WTH"
          cp research/dssat_dtr/data/anningqu/formal_ghcn_rain/ANQH2201.WTH "$R/Weather/ANQH2201.WTH"
          cp research/dssat_dtr/anningqu/AN.SOL "$R/Soil/AN.SOL"
          python research/dssat_dtr/anningqu/build_stageA2_water6_experiments.py "$R/Maize/UFGA8201.MZX" "$R/Maize"
          python research/dssat_dtr/anningqu/patch_stageA2_standard_water_path.py "$R/Maize"
          sudo rm -rf /DSSAT48; sudo ln -s "$R" /DSSAT48
          mkdir -p /tmp/res
          cd "$R/Maize"
          for X in ANQH2101 ANQH2102 ANQH2103 ANQH2104 ANQH2105 ANQH2201 ANQH2202 ANQH2203 ANQH2204 ANQH2205; do
            rm -f Summary.OUT PlantGro.OUT ERROR.OUT WARNING.OUT
            ../dscsm048 A "${X}.MZX" > "/tmp/res/${X}.stdout" 2>&1
            test -s Summary.OUT || { cat "/tmp/res/${X}.stdout"; exit 1; }
            cp Summary.OUT "/tmp/res/${X}_Summary.OUT"
          done
      - name: Robust causal parse against completed three-arm baseline
        run: |
          python - <<'PY'
          from pathlib import Path
          import csv,re
          old={r['scenario']:r for r in csv.DictReader(open('research/dssat_dtr/data/anningqu/m15_extreme_dtt/anningqu_m15_extreme_dtt_three_arm.csv',encoding='utf-8-sig'))}
          keys=['PDAT','EDAT','ADAT','MDAT','CWAM','HWAM','HIAM','LAIX','ETCM','EPCM','ESCM','SWXM','CRST']
          def parse_summary(path):
              lines=Path(path).read_text(errors='replace').splitlines()
              hi=next(i for i,l in enumerate(lines) if l.startswith('@') and 'RUNNO' in l and 'HWAM' in l)
              header=lines[hi]
              data=next(l for l in lines[hi+1:] if l.strip() and not l.startswith(('@','!','*')))
              names=header.split()
              if names and names[0]=='@': names=names[1:]
              elif names and names[0].startswith('@'): names[0]=names[0][1:]
              vals=data.split()
              if len(vals)==len(names): return dict(zip(names,vals))
              starts=[m.start() for m in re.finditer(r'\S+',header)]
              raw=[m.group() for m in re.finditer(r'\S+',header)]
              if raw[0]=='@': raw=raw[1:]; starts=starts[1:]
              elif raw[0].startswith('@'): raw[0]=raw[0][1:]
              out={}
              for j,n in enumerate(raw):
                  a=starts[j]; b=starts[j+1] if j+1<len(starts) else len(data)
                  out[n]=data[a:b].strip()
              return out
          def num(x):
              try:return float(x)
              except:return None
          rows=[]
          for s,b in old.items():
              h=parse_summary(f'/tmp/res/{s}_Summary.OUT')
              r={'scenario':s,'year':b['year'],'sowing':b['sowing']}
              for k in keys:
                  m0=b.get('M0_'+k,''); m15=b.get('M15TT_'+k,''); hv=h.get(k,'')
                  r['M0_'+k]=m0; r['H0TT_'+k]=hv; r['M15TT_'+k]=m15
                  x,y,z=num(m0),num(hv),num(m15)
                  r['D_GENERIC_'+k]='' if x is None or y is None else y-x
                  r['D_LOCAL_'+k]='' if y is None or z is None else z-y
                  r['D_TOTAL_'+k]='' if x is None or z is None else z-x
                  r['GENERIC_EQ_'+k]=int(hv==m0)
                  r['LOCAL_EQ_'+k]=int(m15==hv)
              rows.append(r)
          out=Path('research/dssat_dtr/data/anningqu/h0tt_fast_causal_v2'); out.mkdir(parents=True,exist_ok=True)
          with (out/'h0tt_fast_causal_v2.csv').open('w',newline='',encoding='utf-8-sig') as f:
              w=csv.DictWriter(f,fieldnames=list(rows[0])); w.writeheader(); w.writerows(rows)
          md=['# H0TT fast causal decomposition V2','',
              'Uses the same robust fixed-column parser as the completed three-arm workflow. M0/M15TT come from that completed run; only H0TT was newly simulated.','',
              'GENERIC=H0TT-M0; LOCAL=M15TT-H0TT; TOTAL=M15TT-M0.','',
              '|Year|Sowing|M0 HWAM|H0TT HWAM|M15TT HWAM|Generic dHWAM|Local dHWAM|Total dHWAM|M0 MDAT|H0TT MDAT|M15TT MDAT|',
              '|---:|:---:|---:|---:|---:|---:|---:|---:|---:|---:|---:|']
          for r in rows:
              md.append(f"|{r['year']}|{r['sowing']}|{r['M0_HWAM']}|{r['H0TT_HWAM']}|{r['M15TT_HWAM']}|{r['D_GENERIC_HWAM']}|{r['D_LOCAL_HWAM']}|{r['D_TOTAL_HWAM']}|{r['M0_MDAT']}|{r['H0TT_MDAT']}|{r['M15TT_MDAT']}|")
          md += ['',f"- Generic hourly coupling changes HWAM in **{sum(r['GENERIC_EQ_HWAM']==0 for r in rows)}/10** cases.",
                 f"- Local M15 correction changes HWAM after controlling hourly coupling in **{sum(r['LOCAL_EQ_HWAM']==0 for r in rows)}/10** cases.",
                 f"- Generic hourly coupling changes MDAT in **{sum(r['GENERIC_EQ_MDAT']==0 for r in rows)}/10** cases.",
                 f"- Local M15 correction changes MDAT in **{sum(r['LOCAL_EQ_MDAT']==0 for r in rows)}/10** cases."]
          (out/'README_H0TT_FAST_CAUSAL_V2.md').write_text('\n'.join(md)+'\n',encoding='utf-8')
          print('\n'.join(md))
          PY
      - name: Commit V2 result
        run: |
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/dssat_dtr/data/anningqu/h0tt_fast_causal_v2
          if ! git diff --cached --quiet; then
            git commit -m 'Add robust H0TT causal decomposition results'
            git pull --rebase origin research/dssat-dtr-matrix
            git push origin HEAD:research/dssat-dtr-matrix
          fi

name: DSSAT 4.8.5 M15 source integration

on:
  push:
    branches: [research/dssat-dtr-matrix]
    paths:
      - 'research/dssat_dtr/dssat485/apply_m15_htemp_patch.py'
      - 'research/dssat_dtr/dssat485/build_m15_fortran_unit.py'
      - '.github/workflows/dssat485-m15-source.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-test-m15:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DSSAT_OS_SHA: 0b91373806786b600d89ccfcfff78fa2f82cb26b
      DSSAT_DATA_SHA: 79cb5db71bbca186add92a6a9695866a09c8b51d
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          ref: research/dssat-dtr-matrix
          path: project

      - name: Checkout frozen DSSAT 4.8.5 source
        uses: actions/checkout@v4
        with:
          repository: DSSAT/dssat-csm-os
          ref: ${{ env.DSSAT_OS_SHA }}
          path: upstream-os

      - name: Checkout frozen DSSAT 4.8.5 data
        uses: actions/checkout@v4
        with:
          repository: DSSAT/dssat-csm-data
          ref: ${{ env.DSSAT_DATA_SHA }}
          path: upstream-data

      - name: Install compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran cmake
          gfortran --version | head -1
          cmake --version | head -1

      - name: Apply deterministic M15 patch
        run: |
          set -euxo pipefail
          cp upstream-os/Weather/HMET.for "$RUNNER_TEMP/HMET_M0.for"
          python project/research/dssat_dtr/dssat485/apply_m15_htemp_patch.py upstream-os
          diff -u "$RUNNER_TEMP/HMET_M0.for" upstream-os/Weather/HMET.for > "$RUNNER_TEMP/M15_HMET.patch" || true
          grep -n 'HTEMP_DTRCLOUD\|DTRC=14.8\|ALPHA=7.8094' upstream-os/Weather/HMET.for

      - name: Compile source-extracted M15 Fortran unit test
        run: |
          set -euxo pipefail
          python project/research/dssat_dtr/dssat485/build_m15_fortran_unit.py upstream-os "$RUNNER_TEMP/m15_unit.for"
          gfortran -std=legacy -ffixed-line-length-none "$RUNNER_TEMP/m15_unit.for" -o "$RUNNER_TEMP/m15_unit"
          "$RUNNER_TEMP/m15_unit" | tee "$RUNNER_TEMP/M15_UNIT.txt"
          grep -q 'M15_FORTRAN_UNIT_PASS' "$RUNNER_TEMP/M15_UNIT.txt"

      - name: Configure and build patched DSSAT
        run: |
          set -euxo pipefail
          PREFIX="$RUNNER_TEMP/dssat485_m15"
          cmake -S upstream-os -B upstream-os/build \
            -DCMAKE_BUILD_TYPE=RELEASE \
            -DCMAKE_INSTALL_PREFIX="$PREFIX"
          cmake --build upstream-os/build --parallel 2
          cmake --install upstream-os/build
          test -x "$PREFIX/dscsm048"
          test -f "$PREFIX/DSSATPRO.L48"

      - name: Assemble matching official data
        run: |
          set -euxo pipefail
          PREFIX="$RUNNER_TEMP/dssat485_m15"
          cp -a upstream-data/. "$PREFIX/"
          rm -rf "$PREFIX/.git" "$PREFIX/.github" || true
          test -f "$PREFIX/Maize/UFGA8201.MZX"

      - name: Run official UFGA8201 with patched executable
        run: |
          set -euxo pipefail
          PREFIX="$RUNNER_TEMP/dssat485_m15"
          cd "$PREFIX/Maize"
          "$PREFIX/dscsm048" A UFGA8201.MZX > M15_RUN_STDOUT.txt 2>&1
          cat M15_RUN_STDOUT.txt
          test -s Summary.OUT
          test -s PlantGro.OUT

      - name: Compare M15 outputs with frozen M0 baseline
        run: |
          set -euxo pipefail
          PREFIX="$RUNNER_TEMP/dssat485_m15"
          DEST="$GITHUB_WORKSPACE/project/research/dssat_dtr/data/dssat485_m15_source"
          mkdir -p "$DEST"
          cp upstream-os/Weather/HMET.for "$DEST/HMET_M15.for"
          cp "$RUNNER_TEMP/M15_HMET.patch" "$DEST/M15_HMET.patch"
          cp "$RUNNER_TEMP/M15_UNIT.txt" "$DEST/M15_UNIT.txt"
          cp "$PREFIX/Maize/Summary.OUT" "$DEST/Summary_M15.OUT"
          cp "$PREFIX/Maize/PlantGro.OUT" "$DEST/PlantGro_M15.OUT"
          cp "$PREFIX/Maize/M15_RUN_STDOUT.txt" "$DEST/"
          sha256sum "$PREFIX/Maize"/*.OUT | sort > "$DEST/M15_OUT_SHA256.txt"

          M0DIR="$GITHUB_WORKSPACE/project/research/dssat_dtr/data/dssat485_m0_official"
          test -s "$M0DIR/Summary.OUT"
          test -s "$M0DIR/PlantGro.OUT"
          diff -u "$M0DIR/Summary.OUT" "$PREFIX/Maize/Summary.OUT" > "$DEST/Summary_M0_vs_M15.diff" || true
          diff -u "$M0DIR/PlantGro.OUT" "$PREFIX/Maize/PlantGro.OUT" > "$DEST/PlantGro_M0_vs_M15.diff" || true

          SUM_IDENTICAL=NO
          GRO_IDENTICAL=NO
          cmp -s "$M0DIR/Summary.OUT" "$PREFIX/Maize/Summary.OUT" && SUM_IDENTICAL=YES || true
          cmp -s "$M0DIR/PlantGro.OUT" "$PREFIX/Maize/PlantGro.OUT" && GRO_IDENTICAL=YES || true
          {
            echo '# DSSAT v4.8.5.0 M15 source integration'
            echo
            echo '- Status: **SOURCE BUILD + UNIT + OFFICIAL MAIZE RUN PASS**'
            echo "- Frozen source commit: \`$DSSAT_OS_SHA\`"
            echo "- Frozen data commit: \`$DSSAT_DATA_SHA\`"
            echo '- M15 formal source candidate: DTR-triggered, DSSAT-CLOUDS-modulated sunset-anchor correction.'
            echo '- `DTRC=14.8 C` from primary-station 2000-2016 breakpoint analysis.'
            echo '- `ALPHA=7.8094` from dense Diwopu 2000-2016 sunset-anchor observations.'
            echo '- No coefficient was fitted on primary-station 2017-2024 validation data.'
            echo '- Official `HTEMP` subroutine is preserved unchanged; `HTEMP_DTRCLOUD` is called immediately afterward.'
            echo
            echo '## Source-level acceptance'
            echo '- Source-extracted Fortran unit test: **PASS**.'
            echo '- Low-DTR synthetic case: exact no-change check PASS.'
            echo '- High-DTR with CLOUDS=0: exact no-change check PASS.'
            echo '- High-DTR cloudy synthetic case: bounded and late-branch cooling check PASS.'
            echo '- Full DSSAT CMake build/install: **PASS**.'
            echo '- Official UFGA8201 six-treatment execution: **PASS**.'
            echo "- UFGA8201 Summary.OUT byte-identical to M0: **$SUM_IDENTICAL**."
            echo "- UFGA8201 PlantGro.OUT byte-identical to M0: **$GRO_IDENTICAL**."
            echo
            echo 'Output differences are not themselves a failure because UFGA weather may activate the high-DTR correction. The Florida case is a software/regression execution test, not evidence of Urumqi agronomic benefit.'
            echo
            echo '## Artifacts'
            echo '- `HMET_M15.for`: patched source snapshot.'
            echo '- `M15_HMET.patch`: exact diff against frozen upstream HMET.for.'
            echo '- `M15_UNIT.txt`: source-extracted unit-test output.'
            echo '- `Summary_M15.OUT`, `PlantGro_M15.OUT`: official maize run outputs.'
            echo '- `Summary_M0_vs_M15.diff`, `PlantGro_M0_vs_M15.diff`: comparisons with frozen M0.'
          } > "$DEST/README_M15_SOURCE.md"

      - name: Upload complete patched output set
        uses: actions/upload-artifact@v4
        with:
          name: dssat485-m15-ufga8201-outputs
          path: ${{ runner.temp }}/dssat485_m15/Maize/*.OUT
          retention-days: 90

      - name: Commit M15 source integration snapshot
        working-directory: project
        run: |
          set -euxo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add research/dssat_dtr/data/dssat485_m15_source
          if git diff --cached --quiet; then
            echo 'No M15 source snapshot changes.'
          else
            git commit -m 'Add DSSAT 4.8.5 M15 source integration results'
            git pull --rebase origin research/dssat-dtr-matrix
            git push origin HEAD:research/dssat-dtr-matrix
          fi

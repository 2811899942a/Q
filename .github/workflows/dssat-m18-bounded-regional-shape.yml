name: DSSAT M18 Bounded Regional Shape
on:
  push:
    branches: [research/dssat-regional-dtr-joint-v1]
    paths:
      - 'research/dssat_dtr/scripts/m18_bounded_regional_shape.py'
      - '.github/workflows/dssat-m18-bounded-regional-shape.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  experiment:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/dssat-regional-dtr-joint-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy scipy
      - name: Run M18 bounded regional model
        run: python -u research/dssat_dtr/scripts/m18_bounded_regional_shape.py
      - name: Show M18 evidence
        if: always()
        run: |
          cat research/dssat_dtr/data/m18_bounded_regional_shape/README.md || true
          cat research/dssat_dtr/data/m18_bounded_regional_shape/parameters.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dssat-m18-bounded-${{ github.run_id }}
          path: research/dssat_dtr/data/m18_bounded_regional_shape/
          retention-days: 30
      - name: Commit M18 evidence
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/dssat_dtr/data/m18_bounded_regional_shape
          if ! git diff --cached --quiet; then
            git commit -m 'results(dssat): M18 bounded regional shape experiment'
            git push origin HEAD:research/dssat-regional-dtr-joint-v1
          fi

name: Validate PL-XJ plus Urumqi DTR cooling
on:
  push:
    branches: [research/dssat-dtr-matrix]
    paths:
      - 'research/dssat_dtr/scripts/test_plxj_dtr_cooling_51463.py'
      - '.github/workflows/plxj-dtr-cooling-51463.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/dssat-dtr-matrix
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python research/dssat_dtr/scripts/test_plxj_dtr_cooling_51463.py
      - run: |
          cat research/dssat_dtr/data/processed_51463/README_PLXJ_DTR_COOLING.md
          cat research/dssat_dtr/data/processed_51463/plxj_dtr_cooling_by_dtr.csv
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/dssat_dtr/data/processed_51463
          if git diff --cached --quiet; then echo 'No changes.'; else git commit -m 'Validate PL-XJ plus DTR cooling'; git push origin HEAD:research/dssat-dtr-matrix; fi

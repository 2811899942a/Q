name: Refine Urumqi DTR cooling pulse

on:
  push:
    branches:
      - research/dssat-dtr-matrix
    paths:
      - 'research/dssat_dtr/scripts/refine_dtr_cooling_pulse_51463.py'
      - '.github/workflows/dtr-cooling-pulse-refined-51463.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/dssat-dtr-matrix
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python research/dssat_dtr/scripts/refine_dtr_cooling_pulse_51463.py
      - run: |
          cat research/dssat_dtr/data/processed_51463/README_DTR_COOLING_PULSE_REFINED.md
          cat research/dssat_dtr/data/processed_51463/dtr_cooling_pulse_refined_validation.csv
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/dssat_dtr/data/processed_51463
          if git diff --cached --quiet; then echo 'No changes.'; else git commit -m 'Refine Urumqi cooling pulse amplitude'; git push origin HEAD:research/dssat-dtr-matrix; fi

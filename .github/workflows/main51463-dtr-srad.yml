name: Screen main Urumqi 51463 DTR solar-radiation interaction

on:
  push:
    branches: [research/dssat-dtr-matrix]
    paths:
      - 'research/dssat_dtr/scripts/screen_51463_dtr_srad.py'
      - '.github/workflows/main51463-dtr-srad.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screen-main51463:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: research/dssat-dtr-matrix
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numpy
        run: python -m pip install --quiet numpy
      - name: Screen DTR and SRAD interaction
        run: python research/dssat_dtr/scripts/screen_51463_dtr_srad.py
      - name: Show result
        run: cat research/dssat_dtr/data/processed_51463/README_MAIN51463_DTR_SRAD.md
      - name: Commit result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add research/dssat_dtr/data/processed_51463/README_MAIN51463_DTR_SRAD.md \
                  research/dssat_dtr/data/processed_51463/main51463_dtr_srad_daily.csv \
                  research/dssat_dtr/data/processed_51463/main51463_dtr_srad_models.csv \
                  research/dssat_dtr/data/processed_51463/main51463_highdtr_srad_strata.csv
          git diff --cached --quiet || git commit -m 'Add main 51463 DTR SRAD screening results'
          git push origin HEAD:research/dssat-dtr-matrix

name: Shihezi Soil SLOC Cache Clean V3

on:
  push:
    branches: [research/dssat-dtr-matrix]
    paths:
      - '.github/workflows/shihezi-soil-sloc-cacheclean-v3.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/dssat-dtr-matrix
          fetch-depth: 0

      - name: Rebuild proven V4 base
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import subprocess
          src=Path('.github/workflows/shihezi-real-yield-v4.yml').read_text().splitlines()
          marker='      - name: Build and run frozen three-arm real-yield cases'
          i=next(i for i,x in enumerate(src) if x==marker)
          out=[]; j=i+2
          while j < len(src) and not src[j].startswith('      - '):
              line=src[j]
              if line.startswith('          '): line=line[10:]
              elif line.strip(): raise RuntimeError('unexpected YAML: '+line)
              else: line=''
              out.append(line); j+=1
          p=Path('/tmp/rebuild_v4.sh'); p.write_text('\n'.join(out)+'\n')
          subprocess.run(['bash',str(p)],check=True)
          PY

      - name: Run cache-clean fixed-width SLOC audit
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import subprocess
          src=Path('.github/workflows/shihezi-soil-sloc-fixedwidth-v2.yml').read_text().splitlines()
          marker='      - name: Run fixed-width LOWOM HIGHOM W2 N129'
          i=next(i for i,x in enumerate(src) if x==marker)
          out=[]; j=i+2
          while j < len(src) and not src[j].startswith('      - '):
              line=src[j]
              if line.startswith('          '): line=line[10:]
              elif line.strip(): raise RuntimeError('unexpected YAML: '+line)
              else: line=''
              out.append(line); j+=1
          s='\n'.join(out)+'\n'
          anchor="fixed_sloc(r/'Soil'/'SH.SOL',slocs); setup_n(r/'Maize'/'SHIH2002.MZX')"
          repl=anchor+"\n              # V3: force DSSAT to rebuild runtime input after the soil edit.\n              for cache in list(r.rglob('DSSAT48.INP')):\n                  cache.unlink()\n              assert not list(r.rglob('DSSAT48.INP'))"
          if anchor not in s: raise RuntimeError('SLOC execution anchor missing')
          s=s.replace(anchor,repl,1)
          s=s.replace('soil_sloc_fixedwidth_v2','soil_sloc_cacheclean_v3')
          s=s.replace('fixed-width SLOC propagation audit V2','cache-clean fixed-width SLOC propagation audit V3')
          s=s.replace('README_FIXEDWIDTH_SLOC_V2.md','README_CACHECLEAN_SLOC_V3.md')
          p=Path('/tmp/cacheclean_sloc_v3.sh'); p.write_text(s)
          subprocess.run(['bash',str(p)],check=True)
          PY

      - name: Commit cache-clean result
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/dssat_dtr/data/shihezi_real_case/soil_sloc_cacheclean_v3
          if ! git diff --cached --quiet; then
            git commit -m 'Force rebuild Shihezi SLOC runtime input'
            git pull --rebase origin research/dssat-dtr-matrix
            git push origin HEAD:research/dssat-dtr-matrix
          fi

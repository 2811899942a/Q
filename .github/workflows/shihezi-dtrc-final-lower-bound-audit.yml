name: Shihezi M15 DTRc Final Lower-Bound Audit

on:
  push:
    branches: [research/dssat-dtr-matrix]
    paths:
      - '.github/workflows/shihezi-dtrc-final-lower-bound-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/dssat-dtr-matrix
          fetch-depth: 0

      - name: Install DSSAT build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y gfortran cmake make

      - name: Run final 13.0 13.5 13.8 14.0 lower-bound audit
        run: |
          set -euo pipefail
          python research/dssat_dtr/scripts/shihezi_dtrc_final_lower_bound_audit.py

      - name: Commit final lower-bound evidence
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/dssat_dtr/data/shihezi_real_case/dtrc_final_lower_bound_audit
          if ! git diff --cached --quiet; then
            git commit -m 'Add final M15 DTRc lower-bound audit evidence'
            git pull --rebase origin research/dssat-dtr-matrix
            git push origin HEAD:research/dssat-dtr-matrix
          fi

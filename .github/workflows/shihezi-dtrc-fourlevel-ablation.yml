name: Shihezi M15 DTRc Four-Level Ablation

on:
  push:
    branches: [research/dssat-dtr-matrix]
    paths:
      - '.github/workflows/shihezi-dtrc-fourlevel-ablation.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ablation:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/dssat-dtr-matrix
          fetch-depth: 0

      - name: Install DSSAT build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y gfortran cmake make

      - name: Run 14.0 14.3 14.5 14.8 DTRc ablation
        run: |
          set -euo pipefail
          python research/dssat_dtr/scripts/shihezi_dtrc_fourlevel_ablation.py

      - name: Commit four-level threshold evidence
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/dssat_dtr/data/shihezi_real_case/dtrc_fourlevel_ablation
          if ! git diff --cached --quiet; then
            git commit -m 'Add M15 four-level DTRc ablation evidence'
            git pull --rebase origin research/dssat-dtr-matrix
            git push origin HEAD:research/dssat-dtr-matrix
          fi

name: Anningqu M15 Extreme-DTT Three-Arm Test

on:
  push:
    branches: [research/dssat-dtr-matrix]
    paths:
      - '.github/workflows/anningqu-m15-extreme-dtt.yml'
      - 'research/dssat_dtr/dssat485/apply_m15_htemp_patch.py'
      - 'research/dssat_dtr/dssat485/apply_m15_extreme_dtt_patch.py'
      - 'research/dssat_dtr/anningqu/build_stageA2_water6_experiments.py'
      - 'research/dssat_dtr/anningqu/patch_stageA2_standard_water_path.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extreme_dtt:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/dssat-dtr-matrix
          fetch-depth: 0

      - name: Build M0 M15W M15TT
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y gfortran cmake make
          git clone -q https://github.com/DSSAT/dssat-csm-os.git /tmp/base-os
          git -C /tmp/base-os checkout -q 0b91373806786b600d89ccfcfff78fa2f82cb26b
          git clone -q https://github.com/DSSAT/dssat-csm-data.git /tmp/base-data
          git -C /tmp/base-data checkout -q 79cb5db71bbca186add92a6a9695866a09c8b51d
          cp -a /tmp/base-os /tmp/m0-os
          cp -a /tmp/base-os /tmp/m15w-os
          cp -a /tmp/base-os /tmp/m15tt-os
          python research/dssat_dtr/dssat485/apply_m15_htemp_patch.py /tmp/m15w-os
          python research/dssat_dtr/dssat485/apply_m15_htemp_patch.py /tmp/m15tt-os
          python research/dssat_dtr/dssat485/apply_m15_extreme_dtt_patch.py /tmp/m15tt-os
          for V in m0 m15w m15tt; do
            cmake -S /tmp/${V}-os -B /tmp/${V}-build -DCMAKE_BUILD_TYPE=RELEASE -DCMAKE_INSTALL_PREFIX=/tmp/${V}-run >/dev/null
            cmake --build /tmp/${V}-build --parallel 2 >/dev/null
            cmake --install /tmp/${V}-build >/dev/null
            cp -a /tmp/base-data/. /tmp/${V}-run/
          done

      - name: Assemble identical Water6 standard-path scenarios
        run: |
          set -euo pipefail
          for R in /tmp/m0-run /tmp/m15w-run /tmp/m15tt-run; do
            cp research/dssat_dtr/data/anningqu/formal_ghcn_rain/ANQH2101.WTH "$R/Weather/ANQH2101.WTH"
            cp research/dssat_dtr/data/anningqu/formal_ghcn_rain/ANQH2201.WTH "$R/Weather/ANQH2201.WTH"
            cp research/dssat_dtr/anningqu/AN.SOL "$R/Soil/AN.SOL"
            python research/dssat_dtr/anningqu/build_stageA2_water6_experiments.py "$R/Maize/UFGA8201.MZX" "$R/Maize"
            python research/dssat_dtr/anningqu/patch_stageA2_standard_water_path.py "$R/Maize"
          done

      - name: Run all 30 simulations
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/results/M0 /tmp/results/M15W /tmp/results/M15TT
          SCENS='ANQH2101 ANQH2102 ANQH2103 ANQH2104 ANQH2105 ANQH2201 ANQH2202 ANQH2203 ANQH2204 ANQH2205'
          for V in M0 M15W M15TT; do
            case "$V" in
              M0) ROOT=/tmp/m0-run;;
              M15W) ROOT=/tmp/m15w-run;;
              M15TT) ROOT=/tmp/m15tt-run;;
            esac
            sudo rm -rf /DSSAT48
            sudo ln -s "$ROOT" /DSSAT48
            cd "$ROOT/Maize"
            for X in $SCENS; do
              rm -f Summary.OUT PlantGro.OUT SoilWat.OUT ERROR.OUT WARNING.OUT
              set +e
              ../dscsm048 A "${X}.MZX" > "/tmp/results/${V}/${X}.stdout" 2>&1
              rc=$?
              set -e
              if [ "$rc" -ne 0 ] || [ ! -s Summary.OUT ]; then
                echo "FAILED ${V} ${X} rc=${rc}"
                cat "/tmp/results/${V}/${X}.stdout" || true
                test -f ERROR.OUT && cat ERROR.OUT || true
                test -f WARNING.OUT && cat WARNING.OUT || true
                exit 1
              fi
              cp Summary.OUT "/tmp/results/${V}/${X}_Summary.OUT"
              test -s PlantGro.OUT && cp PlantGro.OUT "/tmp/results/${V}/${X}_PlantGro.OUT" || true
            done
          done

      - name: Parse three-arm crop response
        run: |
          python - <<'PY'
          from pathlib import Path
          import csv,re,statistics
          scenarios=[f'ANQH21{i:02d}' for i in range(1,6)]+[f'ANQH22{i:02d}' for i in range(1,6)]
          sow={1:'Apr21',2:'Apr26',3:'May06',4:'May16',5:'May26'}
          arms=['M0','M15W','M15TT']
          targets=['PDAT','EDAT','ADAT','MDAT','CWAM','HWAM','HIAM','LAIX','ETCM','EPCM','ESCM','SWXM','CRST']

          def parse_summary(path):
              lines=Path(path).read_text(errors='replace').splitlines()
              hi=next(i for i,l in enumerate(lines) if l.startswith('@') and 'RUNNO' in l and 'HWAM' in l)
              header=lines[hi]
              data=next(l for l in lines[hi+1:] if l.strip() and not l.startswith(('@','!','*')))
              names=header.split()
              if names and names[0]=='@': names=names[1:]
              elif names and names[0].startswith('@'): names[0]=names[0][1:]
              vals=data.split()
              if len(vals)==len(names): return dict(zip(names,vals))
              starts=[m.start() for m in re.finditer(r'\S+',header)]
              raw=[m.group() for m in re.finditer(r'\S+',header)]
              if raw[0]=='@': raw=raw[1:]; starts=starts[1:]
              elif raw[0].startswith('@'): raw[0]=raw[0][1:]
              out={}
              for j,n in enumerate(raw):
                  a=starts[j]; b=starts[j+1] if j+1<len(starts) else len(data)
                  out[n]=data[a:b].strip()
              return out

          def num(x):
              try:return float(x)
              except:return None

          rows=[]
          for sc in scenarios:
              d={a:parse_summary(f'/tmp/results/{a}/{sc}_Summary.OUT') for a in arms}
              idx=int(sc[6:8]); year=2000+int(sc[4:6])
              r={'scenario':sc,'year':year,'sowing':sow[idx]}
              for a in arms:
                  for k in targets:r[f'{a}_{k}']=d[a].get(k,'')
              for k in targets:
                  a=num(d['M0'].get(k)); b=num(d['M15W'].get(k)); c=num(d['M15TT'].get(k))
                  r[f'D_W_M0_{k}']='' if a is None or b is None else b-a
                  r[f'D_TT_W_{k}']='' if b is None or c is None else c-b
                  r[f'D_TT_M0_{k}']='' if a is None or c is None else c-a
              rows.append(r)

          out=Path('research/dssat_dtr/data/anningqu/m15_extreme_dtt'); out.mkdir(parents=True,exist_ok=True)
          with (out/'anningqu_m15_extreme_dtt_three_arm.csv').open('w',newline='',encoding='utf-8-sig') as f:
              w=csv.DictWriter(f,fieldnames=list(rows[0])); w.writeheader(); w.writerows(rows)

          changed_w=[]; changed_tt=[]
          for r in rows:
              if any(isinstance(r[f'D_W_M0_{k}'],float) and abs(r[f'D_W_M0_{k}'])>1e-9 for k in targets): changed_w.append(r['scenario'])
              if any(isinstance(r[f'D_TT_W_{k}'],float) and abs(r[f'D_TT_W_{k}'])>1e-9 for k in targets): changed_tt.append(r['scenario'])

          md=['# Anningqu M15 extreme-DTT three-arm propagation test','',
              'Arms: M0 = official DSSAT v4.8.5; M15W = frozen Urumqi HMET hourly-temperature correction only; M15TT = M15W plus replacement of CERES-Maize synthetic extreme-day hourly TH with WEATHER%TGRO.','',
              'The M15TT crop coupling is active only in the pre-existing CERES branch `TMIN < TBASE OR TMAX > DOPT`; the normal-temperature DTT branch and thermal thresholds are unchanged.','',
              '|Year|Sowing|M0 ADAT|M15W ADAT|M15TT ADAT|M0 MDAT|M15TT MDAT|M0 HWAM|M15W HWAM|M15TT HWAM|dHWAM TT-W|M0 CWAM|M15TT CWAM|dCWAM TT-W|',
              '|---:|:---:|---:|---:|---:|---:|---:|---:|---:|---:|---:|---:|---:|---:|']
          for r in rows:
              md.append(f"|{r['year']}|{r['sowing']}|{r['M0_ADAT']}|{r['M15W_ADAT']}|{r['M15TT_ADAT']}|{r['M0_MDAT']}|{r['M15TT_MDAT']}|{r['M0_HWAM']}|{r['M15W_HWAM']}|{r['M15TT_HWAM']}|{r['D_TT_W_HWAM']}|{r['M0_CWAM']}|{r['M15TT_CWAM']}|{r['D_TT_W_CWAM']}|")
          md += ['',f'- Weather-only M15W scenarios with any Summary response: **{len(changed_w)}/10** ({", ".join(changed_w) if changed_w else "none"}).',
                 f'- Extreme-DTT coupling M15TT scenarios with any Summary response relative to M15W: **{len(changed_tt)}/10** ({", ".join(changed_tt) if changed_tt else "none"}).',
                 '- Primary causal contrast for the new relationship is M15TT minus M15W. M0 minus M15W checks whether weather-only hourly improvement reaches CERES outputs without the coupling.']
          (out/'README_M15_EXTREME_DTT.md').write_text('\n'.join(md)+'\n',encoding='utf-8')
          print('\n'.join(md))
          PY

      - name: Commit three-arm results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/dssat_dtr/data/anningqu/m15_extreme_dtt
          if ! git diff --cached --quiet; then
            git commit -m 'Add Anningqu M15 extreme-DTT three-arm results'
            git pull --rebase origin research/dssat-dtr-matrix
            git push origin HEAD:research/dssat-dtr-matrix
          fi

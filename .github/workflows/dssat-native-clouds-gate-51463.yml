name: Test DSSAT native CLOUDS gate for Urumqi HTEMP

on:
  push:
    branches: [research/dssat-dtr-matrix]
    paths:
      - 'research/dssat_dtr/scripts/fit_dssat_native_clouds_gate_51463.py'
      - '.github/workflows/dssat-native-clouds-gate-51463.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-native-clouds:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: research/dssat-dtr-matrix
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run DSSAT-native CLOUDS gate test
        run: python research/dssat_dtr/scripts/fit_dssat_native_clouds_gate_51463.py
      - name: Show result
        run: cat research/dssat_dtr/data/processed_51463/README_DSSAT_NATIVE_CLOUDS_GATE.md
      - name: Commit result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add research/dssat_dtr/data/processed_51463/README_DSSAT_NATIVE_CLOUDS_GATE.md \
                  research/dssat_dtr/data/processed_51463/dssat_native_clouds_gate_parameters.csv \
                  research/dssat_dtr/data/processed_51463/dssat_native_clouds_gate_validation.csv \
                  research/dssat_dtr/data/processed_51463/dssat_native_clouds_gate_by_dtr.csv \
                  research/dssat_dtr/data/processed_51463/dssat_native_clouds_gate_by_hour.csv \
                  research/dssat_dtr/data/processed_51463/dssat_native_clouds_gate_by_cloud_strata.csv
          if git diff --cached --quiet; then
            echo 'No result changes.'
          else
            git commit -m 'Add DSSAT-native CLOUDS gate results'
            git pull --rebase origin research/dssat-dtr-matrix
            git push origin HEAD:research/dssat-dtr-matrix
          fi

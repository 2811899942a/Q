name: Fit Urumqi 51463 post-peak correction

on:
  push:
    branches:
      - research/dssat-dtr-matrix
    paths:
      - 'research/dssat_dtr/scripts/fit_dtr_postpeak_correction_51463.py'
      - '.github/workflows/postpeak-correction-51463.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fit-postpeak:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: research/dssat-dtr-matrix
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fit and validate post-peak correction
        run: python research/dssat_dtr/scripts/fit_dtr_postpeak_correction_51463.py
      - name: Show result
        run: |
          cat research/dssat_dtr/data/processed_51463/README_POSTPEAK_CORRECTION.md
          echo '--- DTR bins ---'
          cat research/dssat_dtr/data/processed_51463/postpeak_validation_by_dtr.csv
      - name: Commit result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/dssat_dtr/data/processed_51463
          if git diff --cached --quiet; then
            echo 'No changes.'
          else
            git commit -m 'Validate Urumqi DTR-triggered post-peak correction'
            git push origin HEAD:research/dssat-dtr-matrix
          fi

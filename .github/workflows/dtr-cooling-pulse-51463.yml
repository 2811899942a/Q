name: Validate Urumqi DTR cooling pulse

on:
  push:
    branches:
      - research/dssat-dtr-matrix
    paths:
      - 'research/dssat_dtr/scripts/test_dtr_cooling_pulse_51463.py'
      - '.github/workflows/dtr-cooling-pulse-51463.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/dssat-dtr-matrix
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test cooling pulse
        run: python research/dssat_dtr/scripts/test_dtr_cooling_pulse_51463.py
      - name: Show result
        run: |
          cat research/dssat_dtr/data/processed_51463/README_DTR_COOLING_PULSE.md
          echo '--- by DTR ---'
          cat research/dssat_dtr/data/processed_51463/dtr_cooling_pulse_by_dtr.csv
      - name: Commit results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/dssat_dtr/data/processed_51463
          if git diff --cached --quiet; then
            echo 'No changes.'
          else
            git commit -m 'Validate Urumqi DTR cooling pulse'
            git push origin HEAD:research/dssat-dtr-matrix
          fi

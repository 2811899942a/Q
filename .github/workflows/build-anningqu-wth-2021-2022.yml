name: Build Anningqu DSSAT weather 2021-2022

on:
  push:
    branches: [research/dssat-dtr-matrix]
    paths:
      - 'research/dssat_dtr/anningqu/build_anningqu_wth_2021_2022.py'
      - '.github/workflows/build-anningqu-wth-2021-2022.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-wth:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/dssat-dtr-matrix
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build public Anningqu WTH files
        run: python research/dssat_dtr/anningqu/build_anningqu_wth_2021_2022.py
      - name: Validate WTH structure and show QC
        shell: bash
        run: |
          set -euxo pipefail
          cat research/dssat_dtr/data/anningqu/README_ANINGQU_WTH.md
          cat research/dssat_dtr/data/anningqu/anningqu_wth_qc_by_year.csv
          for f in research/dssat_dtr/data/anningqu/ANQH2101.WTH research/dssat_dtr/data/anningqu/ANQH2201.WTH; do
            test -s "$f"
            grep -q '^@DATE  SRAD  TMAX  TMIN  RAIN' "$f"
          done
          test "$(grep -E '^[0-9]{5} ' research/dssat_dtr/data/anningqu/ANQH2101.WTH | wc -l)" -eq 365
          test "$(grep -E '^[0-9]{5} ' research/dssat_dtr/data/anningqu/ANQH2201.WTH | wc -l)" -eq 365
      - name: Commit generated weather and QC
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add research/dssat_dtr/data/anningqu/ANQH2101.WTH \
                  research/dssat_dtr/data/anningqu/ANQH2201.WTH \
                  research/dssat_dtr/data/anningqu/anningqu_wth_daily_2021_2022.csv \
                  research/dssat_dtr/data/anningqu/anningqu_wth_qc_by_year.csv \
                  research/dssat_dtr/data/anningqu/README_ANINGQU_WTH.md
          if git diff --cached --quiet; then
            echo 'No weather changes.'
          else
            git commit -m 'Add Anningqu public DSSAT weather 2021-2022'
            git pull --rebase origin research/dssat-dtr-matrix
            git push origin HEAD:research/dssat-dtr-matrix
          fi

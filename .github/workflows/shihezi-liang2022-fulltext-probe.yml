name: Shihezi Liang 2022 Fulltext Probe

on:
  push:
    branches: [research/dssat-dtr-matrix]
    paths:
      - '.github/workflows/shihezi-liang2022-fulltext-probe.yml'
      - 'research/dssat_dtr/shihezi/probe_liang2022_fulltext.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/dssat-dtr-matrix
          fetch-depth: 0
      - name: Install PDF text reader
        run: python -m pip install --quiet pypdf
      - name: Probe official Liang 2022 article for missing field inputs
        run: python research/dssat_dtr/shihezi/probe_liang2022_fulltext.py
      - name: Commit bounded evidence report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/dssat_dtr/data/shihezi_real_case/liang2022_probe
          if ! git diff --cached --quiet; then
            git commit -m 'Add Liang 2022 Shihezi evidence probe results'
            git pull --rebase origin research/dssat-dtr-matrix
            git push origin HEAD:research/dssat-dtr-matrix
          fi

name: M15 V2 cloud gamma temperature round4

on:
  push:
    branches: [research/dssat-m15-temp-accuracy-v2]
    paths:
      - 'research/dssat_dtr/scripts/m15_v2_cloud_gamma_round4.py'
      - '.github/workflows/m15-v2-cloud-gamma-round4.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/dssat-m15-temp-accuracy-v2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run temperature-only cloud-gamma experiment
        run: |
          set -euo pipefail
          python research/dssat_dtr/scripts/m15_v2_cloud_gamma_round4.py
      - name: Show result
        run: |
          cat research/dssat_dtr/data/m15_temp_v2/cloud_gamma_round4/README_M15_V2_CLOUD_GAMMA_ROUND4.md
      - name: Commit round4 evidence
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/dssat_dtr/data/m15_temp_v2/cloud_gamma_round4 \
                  research/dssat_dtr/CHECKPOINT_20260830_M15_V2_ROUND4_CLOUD_GAMMA_RESULT.md
          if ! git diff --cached --quiet; then
            git commit -m 'Add M15 V2 cloud gamma round4 results'
            git pull --rebase origin research/dssat-m15-temp-accuracy-v2
            git push origin HEAD:research/dssat-m15-temp-accuracy-v2
          fi

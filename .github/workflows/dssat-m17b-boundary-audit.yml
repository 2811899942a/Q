name: DSSAT M17b Boundary Audit
on:
  push:
    branches: [research/dssat-regional-dtr-joint-v1]
    paths:
      - 'research/dssat_dtr/scripts/m17b_regional_radwarp_boundary_audit.py'
      - '.github/workflows/dssat-m17b-boundary-audit.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/dssat-regional-dtr-joint-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy scipy
      - run: python -u research/dssat_dtr/scripts/m17b_regional_radwarp_boundary_audit.py
      - if: always()
        run: cat research/dssat_dtr/data/m17b_regional_radwarp_boundary_audit/README.md || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dssat-m17b-boundary-${{ github.run_id }}
          path: research/dssat_dtr/data/m17b_regional_radwarp_boundary_audit/
          retention-days: 30
      - name: Commit evidence
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/dssat_dtr/data/m17b_regional_radwarp_boundary_audit
          if ! git diff --cached --quiet; then
            git commit -m 'results(dssat): M17 expanded-bound audit'
            git push origin HEAD:research/dssat-regional-dtr-joint-v1
          fi

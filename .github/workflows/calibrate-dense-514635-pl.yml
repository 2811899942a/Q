name: Calibrate dense Diwopu PL baseline

on:
  push:
    branches: [research/dssat-dtr-matrix]
    paths:
      - 'research/dssat_dtr/scripts/calibrate_dense_514635_pl.py'
      - '.github/workflows/calibrate-dense-514635-pl.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  calibrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/dssat-dtr-matrix
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install scientific dependencies
        run: python -m pip install --quiet numpy scipy
      - name: Calibrate Diwopu Parton-Logan baseline
        run: python research/dssat_dtr/scripts/calibrate_dense_514635_pl.py
      - name: Show calibration results
        run: |
          cat research/dssat_dtr/data/processed_514635/README_DIWOPU_PL_CALIBRATION.md
          echo '--- validation metrics ---'
          cat research/dssat_dtr/data/processed_514635/diwopu_pl_validation.csv
          echo '--- high-DTR hourly residuals ---'
          cat research/dssat_dtr/data/processed_514635/diwopu_pl_highdtr_by_hour.csv
      - name: Commit results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/dssat_dtr/data/processed_514635
          if git diff --cached --quiet; then
            echo 'No changes.'
          else
            git commit -m 'Calibrate dense Diwopu Parton-Logan baseline'
            git push origin HEAD:research/dssat-dtr-matrix
          fi

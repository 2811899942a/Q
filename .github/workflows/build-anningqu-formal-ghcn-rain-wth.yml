name: Build formal Anningqu GHCN-rain WTH

on:
  push:
    branches: [research/dssat-dtr-matrix]
    paths:
      - 'research/dssat_dtr/anningqu/build_formal_ghcn_rain_wth.py'
      - '.github/workflows/build-anningqu-formal-ghcn-rain-wth.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-formal-wth:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/dssat-dtr-matrix
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python research/dssat_dtr/anningqu/build_formal_ghcn_rain_wth.py
      - name: Validate formal and sensitivity WTH pairs
        run: |
          set -euxo pipefail
          cat research/dssat_dtr/data/anningqu/formal_ghcn_rain/README_FORMAL_WTH.md
          for d in formal_ghcn_rain sensitivity_power_rain; do
            for y in 21 22; do
              f="research/dssat_dtr/data/anningqu/$d/ANQH${y}01.WTH"
              test -s "$f"
              test "$(grep -E '^[0-9]{5} ' "$f" | wc -l)" -eq 365
            done
          done
      - name: Commit formal and sensitivity weather pairs
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add research/dssat_dtr/data/anningqu/formal_ghcn_rain research/dssat_dtr/data/anningqu/sensitivity_power_rain
          if git diff --cached --quiet; then echo 'No changes.'; else git commit -m 'Add formal GHCN-rain and POWER-rain Anningqu WTH pairs'; git pull --rebase origin research/dssat-dtr-matrix; git push origin HEAD:research/dssat-dtr-matrix; fi

name: Test M15 dense-station sunset transfer

on:
  push:
    branches: [research/dssat-dtr-matrix]
    paths:
      - 'research/dssat_dtr/scripts/test_m15_dense_transfer_sunset_anchor_51463.py'
      - '.github/workflows/m15-dense-transfer-sunset-51463.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-m15:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/dssat-dtr-matrix
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python research/dssat_dtr/scripts/test_m15_dense_transfer_sunset_anchor_51463.py
      - run: cat research/dssat_dtr/data/processed_51463/README_M15_DENSE_TRANSFER_SUNSET.md
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add research/dssat_dtr/data/processed_51463/README_M15_DENSE_TRANSFER_SUNSET.md \
                  research/dssat_dtr/data/processed_51463/m15_dense_transfer_parameters.csv \
                  research/dssat_dtr/data/processed_51463/m15_dense_transfer_validation.csv \
                  research/dssat_dtr/data/processed_51463/m15_dense_transfer_by_dtr.csv \
                  research/dssat_dtr/data/processed_51463/m15_dense_transfer_by_hour.csv \
                  research/dssat_dtr/data/processed_51463/m15_dense_transfer_by_cloud_strata.csv \
                  research/dssat_dtr/data/processed_51463/m15_dense_transfer_by_year.csv \
                  research/dssat_dtr/data/processed_51463/m15_dense_transfer_shape_checks.csv
          if git diff --cached --quiet; then echo 'No changes.'; else git commit -m 'Add M15 dense-station sunset-transfer results'; git pull --rebase origin research/dssat-dtr-matrix; git push origin HEAD:research/dssat-dtr-matrix; fi

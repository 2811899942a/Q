name: Invert Urumqi post-peak thermal phase
on:
  push:
    branches: [research/dssat-dtr-matrix]
    paths:
      - 'research/dssat_dtr/scripts/invert_postpeak_phase_51463.py'
      - '.github/workflows/postpeak-phase-inversion-51463.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  invert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/dssat-dtr-matrix
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python research/dssat_dtr/scripts/invert_postpeak_phase_51463.py
      - run: |
          cat research/dssat_dtr/data/processed_51463/README_POSTPEAK_PHASE_INVERSION.md
          cat research/dssat_dtr/data/processed_51463/postpeak_phase_inversion_summary.csv
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/dssat_dtr/data/processed_51463
          if git diff --cached --quiet; then echo 'No changes.'; else git commit -m 'Invert Urumqi post-peak thermal phase'; git push origin HEAD:research/dssat-dtr-matrix; fi

name: Validate DSSAT v4.8.5 official baseline

on:
  push:
    branches: [research/dssat-dtr-matrix]
    paths:
      - '.github/workflows/dssat485-official-baseline.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          ref: research/dssat-dtr-matrix

      - name: Install compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gfortran cmake make

      - name: Fetch exact official v4.8.5.0 source and data
        run: |
          git clone --depth 1 --branch v4.8.5.0 https://github.com/DSSAT/dssat-csm-os.git /tmp/dssat485-os
          git clone --depth 1 --branch v4.8.5.0 https://github.com/DSSAT/dssat-csm-data.git /tmp/dssat485-data
          git -C /tmp/dssat485-os rev-parse HEAD | tee /tmp/os_sha.txt
          git -C /tmp/dssat485-data rev-parse HEAD | tee /tmp/data_sha.txt

      - name: Build and install official source
        run: |
          cmake -S /tmp/dssat485-os -B /tmp/dssat485-build \
            -DCMAKE_BUILD_TYPE=RELEASE \
            -DCMAKE_INSTALL_PREFIX=/tmp/dssat485-run
          cmake --build /tmp/dssat485-build --parallel 2
          cmake --install /tmp/dssat485-build
          cp -a /tmp/dssat485-data/. /tmp/dssat485-run/
          test -x /tmp/dssat485-run/dscsm048
          /tmp/dssat485-run/dscsm048 --help > /tmp/dssat_help.txt 2>&1 || true

      - name: Run official maize example UFGA8201
        run: |
          cd /tmp/dssat485-run/Maize
          rm -f Summary.OUT PlantGro.OUT Evaluate.OUT WARNING.OUT ERROR.OUT
          ../dscsm048 A UFGA8201.MZX > /tmp/ufga8201_stdout.txt 2>&1
          test -s Summary.OUT
          test -s PlantGro.OUT
          cp Summary.OUT /tmp/Summary_M0.OUT
          cp PlantGro.OUT /tmp/PlantGro_M0.OUT
          grep -c '^ *[0-9]' Summary.OUT > /tmp/summary_numeric_rows.txt || true

      - name: Write reproducibility report
        run: |
          mkdir -p research/dssat_dtr/source_validation
          OS_SHA=$(cat /tmp/os_sha.txt)
          DATA_SHA=$(cat /tmp/data_sha.txt)
          EXE_SHA=$(sha256sum /tmp/dssat485-run/dscsm048 | awk '{print $1}')
          SUM_SHA=$(sha256sum /tmp/Summary_M0.OUT | awk '{print $1}')
          PG_SHA=$(sha256sum /tmp/PlantGro_M0.OUT | awk '{print $1}')
          ROWS=$(cat /tmp/summary_numeric_rows.txt)
          cat > research/dssat_dtr/source_validation/README_DSSAT485_BASELINE.md <<EOF
          # DSSAT v4.8.5.0 official Linux baseline

          Status: **PASS**

          Exact upstream refs:
          - source tag: `DSSAT/dssat-csm-os@v4.8.5.0`
          - source commit: `${OS_SHA}`
          - data tag: `DSSAT/dssat-csm-data@v4.8.5.0`
          - data commit: `${DATA_SHA}`

          Build:
          - Ubuntu GitHub Actions
          - GNU Fortran + CMake RELEASE
          - installed executable: `dscsm048`
          - executable SHA256: `${EXE_SHA}`

          Regression smoke test:
          - official maize example: `Maize/UFGA8201.MZX`
          - command: `../dscsm048 A UFGA8201.MZX`
          - `Summary.OUT` generated: YES
          - `PlantGro.OUT` generated: YES
          - numeric Summary rows detected: ${ROWS}
          - Summary SHA256: `${SUM_SHA}`
          - PlantGro SHA256: `${PG_SHA}`

          This is the frozen M0 source-level baseline for all later HTEMP modifications.
          EOF

      - name: Commit baseline report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/dssat_dtr/source_validation/README_DSSAT485_BASELINE.md
          if ! git diff --cached --quiet; then
            git commit -m 'Record DSSAT 4.8.5 official baseline validation'
            git pull --rebase origin research/dssat-dtr-matrix
            git push origin HEAD:research/dssat-dtr-matrix
          fi

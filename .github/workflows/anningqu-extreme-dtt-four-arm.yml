name: Anningqu Extreme-DTT Four-Arm Causal Test

on:
  push:
    branches: [research/dssat-dtr-matrix]
    paths:
      - '.github/workflows/anningqu-extreme-dtt-four-arm.yml'
      - 'research/dssat_dtr/dssat485/apply_m15_htemp_patch.py'
      - 'research/dssat_dtr/dssat485/apply_extreme_dtt_tgro_patch.py'
      - 'research/dssat_dtr/anningqu/build_stageA2_water6_experiments.py'
      - 'research/dssat_dtr/anningqu/patch_stageA2_standard_water_path.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  four_arm:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/dssat-dtr-matrix
          fetch-depth: 0

      - name: Build four source arms
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y gfortran cmake make
          git clone -q https://github.com/DSSAT/dssat-csm-os.git /tmp/base-os
          git -C /tmp/base-os checkout -q 0b91373806786b600d89ccfcfff78fa2f82cb26b
          git clone -q https://github.com/DSSAT/dssat-csm-data.git /tmp/base-data
          git -C /tmp/base-data checkout -q 79cb5db71bbca186add92a6a9695866a09c8b51d
          for V in m0 h0tt m15w m15tt; do cp -a /tmp/base-os /tmp/${V}-os; done
          python research/dssat_dtr/dssat485/apply_extreme_dtt_tgro_patch.py /tmp/h0tt-os
          python research/dssat_dtr/dssat485/apply_m15_htemp_patch.py /tmp/m15w-os
          python research/dssat_dtr/dssat485/apply_m15_htemp_patch.py /tmp/m15tt-os
          python research/dssat_dtr/dssat485/apply_extreme_dtt_tgro_patch.py /tmp/m15tt-os
          for V in m0 h0tt m15w m15tt; do
            cmake -S /tmp/${V}-os -B /tmp/${V}-build -DCMAKE_BUILD_TYPE=RELEASE -DCMAKE_INSTALL_PREFIX=/tmp/${V}-run >/dev/null
            cmake --build /tmp/${V}-build --parallel 2 >/dev/null
            cmake --install /tmp/${V}-build >/dev/null
            cp -a /tmp/base-data/. /tmp/${V}-run/
          done

      - name: Assemble identical Anningqu scenarios
        run: |
          set -euo pipefail
          for R in /tmp/m0-run /tmp/h0tt-run /tmp/m15w-run /tmp/m15tt-run; do
            cp research/dssat_dtr/data/anningqu/formal_ghcn_rain/ANQH2101.WTH "$R/Weather/ANQH2101.WTH"
            cp research/dssat_dtr/data/anningqu/formal_ghcn_rain/ANQH2201.WTH "$R/Weather/ANQH2201.WTH"
            cp research/dssat_dtr/anningqu/AN.SOL "$R/Soil/AN.SOL"
            python research/dssat_dtr/anningqu/build_stageA2_water6_experiments.py "$R/Maize/UFGA8201.MZX" "$R/Maize"
            python research/dssat_dtr/anningqu/patch_stageA2_standard_water_path.py "$R/Maize"
          done

      - name: Run 40 real DSSAT simulations
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/results/{M0,H0TT,M15W,M15TT}
          SCENS='ANQH2101 ANQH2102 ANQH2103 ANQH2104 ANQH2105 ANQH2201 ANQH2202 ANQH2203 ANQH2204 ANQH2205'
          for V in M0 H0TT M15W M15TT; do
            case "$V" in
              M0) ROOT=/tmp/m0-run;; H0TT) ROOT=/tmp/h0tt-run;; M15W) ROOT=/tmp/m15w-run;; M15TT) ROOT=/tmp/m15tt-run;;
            esac
            sudo rm -rf /DSSAT48; sudo ln -s "$ROOT" /DSSAT48
            cd "$ROOT/Maize"
            for X in $SCENS; do
              rm -f Summary.OUT PlantGro.OUT SoilWat.OUT ERROR.OUT WARNING.OUT
              set +e; ../dscsm048 A "${X}.MZX" > "/tmp/results/${V}/${X}.stdout" 2>&1; rc=$?; set -e
              if [ "$rc" -ne 0 ] || [ ! -s Summary.OUT ]; then
                echo "FAILED ${V} ${X} rc=${rc}"; cat "/tmp/results/${V}/${X}.stdout" || true
                test -f ERROR.OUT && cat ERROR.OUT || true; test -f WARNING.OUT && cat WARNING.OUT || true; exit 1
              fi
              cp Summary.OUT "/tmp/results/${V}/${X}_Summary.OUT"
              test -s PlantGro.OUT && cp PlantGro.OUT "/tmp/results/${V}/${X}_PlantGro.OUT" || true
            done
          done

      - name: Parse causal contrasts
        run: |
          python - <<'PY'
          from pathlib import Path
          import csv,re
          scens=[f'ANQH21{i:02d}' for i in range(1,6)]+[f'ANQH22{i:02d}' for i in range(1,6)]
          sow={1:'Apr21',2:'Apr26',3:'May06',4:'May16',5:'May26'}
          arms=['M0','H0TT','M15W','M15TT']
          keys=['PDAT','EDAT','ADAT','MDAT','CWAM','HWAM','HIAM','LAIX','ETCM','EPCM','ESCM','SWXM','CRST']
          def read(p):
            ls=Path(p).read_text(errors='replace').splitlines(); i=next(i for i,l in enumerate(ls) if l.startswith('@') and 'RUNNO' in l and 'HWAM' in l)
            h=ls[i].split(); h=h[1:] if h[0]=='@' else ([h[0][1:]]+h[1:] if h[0].startswith('@') else h)
            d=next(l for l in ls[i+1:] if l.strip() and not l.startswith(('@','!','*'))).split()
            return dict(zip(h,d))
          def n(x):
            try:return float(x)
            except:return None
          rows=[]
          for s in scens:
            a={v:read(f'/tmp/results/{v}/{s}_Summary.OUT') for v in arms}; r={'scenario':s,'year':2000+int(s[4:6]),'sowing':sow[int(s[6:8])]}
            for v in arms:
              for k in keys:r[f'{v}_{k}']=a[v].get(k,'')
            for k in keys:
              vals={v:n(a[v].get(k)) for v in arms}
              for name,x,y in [('GENERIC','H0TT','M0'),('WEATHER','M15W','M0'),('LOCAL','M15TT','H0TT'),('TOTAL','M15TT','M0')]:
                r[f'D_{name}_{k}']='' if vals[x] is None or vals[y] is None else vals[x]-vals[y]
            rows.append(r)
          out=Path('research/dssat_dtr/data/anningqu/extreme_dtt_four_arm'); out.mkdir(parents=True,exist_ok=True)
          with (out/'anningqu_extreme_dtt_four_arm.csv').open('w',newline='',encoding='utf-8-sig') as f:
            w=csv.DictWriter(f,fieldnames=list(rows[0])); w.writeheader(); w.writerows(rows)
          md=['# Anningqu extreme-DTT four-arm causal test','',
              'M0 = official DSSAT; H0TT = official HMET hourly temperature coupled to the existing CERES extreme-day DTT branch; M15W = M15 weather correction only; M15TT = M15 weather correction plus the same crop-side coupling.','',
              'Causal contrasts: GENERIC=H0TT-M0; WEATHER=M15W-M0; LOCAL=M15TT-H0TT; TOTAL=M15TT-M0. LOCAL is the clean estimate of the extra Xinjiang high-DTR correction under identical hourly coupling.','',
              '|Year|Sowing|M0 HWAM|H0TT HWAM|M15W HWAM|M15TT HWAM|Generic dHWAM|Local dHWAM|Total dHWAM|M0 MDAT|H0TT MDAT|M15TT MDAT|',
              '|---:|:---:|---:|---:|---:|---:|---:|---:|---:|---:|---:|---:|']
          for r in rows:
            md.append(f"|{r['year']}|{r['sowing']}|{r['M0_HWAM']}|{r['H0TT_HWAM']}|{r['M15W_HWAM']}|{r['M15TT_HWAM']}|{r['D_GENERIC_HWAM']}|{r['D_LOCAL_HWAM']}|{r['D_TOTAL_HWAM']}|{r['M0_MDAT']}|{r['H0TT_MDAT']}|{r['M15TT_MDAT']}|")
          md += ['','Interpretation gate: any claim of Xinjiang-specific crop contribution must use LOCAL (M15TT-H0TT), while TOTAL quantifies the complete extreme-day hourly-temperature method relative to official CERES.']
          (out/'README_EXTREME_DTT_FOUR_ARM.md').write_text('\n'.join(md)+'\n',encoding='utf-8')
          print('\n'.join(md))
          PY

      - name: Commit four-arm results
        run: |
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/dssat_dtr/data/anningqu/extreme_dtt_four_arm
          if ! git diff --cached --quiet; then
            git commit -m 'Add Anningqu extreme-DTT four-arm causal results'
            git pull --rebase origin research/dssat-dtr-matrix
            git push origin HEAD:research/dssat-dtr-matrix
          fi

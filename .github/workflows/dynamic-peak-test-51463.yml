name: Test Urumqi 51463 dynamic peak mechanism

on:
  push:
    branches:
      - research/dssat-dtr-matrix
    paths:
      - 'research/dssat_dtr/scripts/test_threshold_dynamic_peak_51463.py'
      - '.github/workflows/dynamic-peak-test-51463.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-mechanisms:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: research/dssat-dtr-matrix
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run mechanism comparison
        run: python research/dssat_dtr/scripts/test_threshold_dynamic_peak_51463.py
      - name: Show result
        run: |
          cat research/dssat_dtr/data/processed_51463/README_DYNAMIC_PEAK_TEST.md
          echo '--- DTR bins ---'
          cat research/dssat_dtr/data/processed_51463/dynamic_peak_validation_by_dtr.csv
          echo '--- key hours ---'
          cat research/dssat_dtr/data/processed_51463/dynamic_peak_validation_by_hour.csv
      - name: Commit result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/dssat_dtr/data/processed_51463
          if git diff --cached --quiet; then
            echo 'No changes.'
          else
            git commit -m 'Compare Urumqi DTR-threshold peak and shoulder mechanisms'
            git push origin HEAD:research/dssat-dtr-matrix
          fi

name: Inspect Urumqi 514635 NOAA coverage
on:
  push:
    branches: [research/dssat-dtr-matrix]
    paths:
      - 'research/dssat_dtr/scripts/inspect_noaa_514635.py'
      - '.github/workflows/inspect-514635.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/dssat-dtr-matrix
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python research/dssat_dtr/scripts/inspect_noaa_514635.py
      - run: |
          cat research/dssat_dtr/data/processed_514635/README_COVERAGE.md
          cat research/dssat_dtr/data/processed_514635/yearly_coverage.csv
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/dssat_dtr/data/processed_514635
          if git diff --cached --quiet; then echo 'No changes.'; else git commit -m 'Inspect NOAA 514635 Urumqi coverage'; git push origin HEAD:research/dssat-dtr-matrix; fi

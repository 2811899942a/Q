name: Anningqu M0 M15 M19 Crop Propagation
on:
  push:
    branches: [research/dssat-regional-dtr-joint-v1]
    paths:
      - 'research/dssat_dtr/dssat485/apply_m19_htemp_patch.py'
      - 'research/dssat_dtr/data/m19_regional_anomaly_threshold/parameters.json'
      - 'research/dssat_dtr/data/m19_regional_anomaly_threshold/regional_dtr_profile_2000_2016.csv'
      - '.github/workflows/anningqu-m0-m15-m19-propagation.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  propagate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/dssat-regional-dtr-joint-v1
      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gfortran cmake make
          python -m pip install --quiet pandas
      - name: Fetch frozen DSSAT 4.8.5 source and data
        run: |
          set -euo pipefail
          git clone https://github.com/DSSAT/dssat-csm-os.git /tmp/m0-os
          git -C /tmp/m0-os checkout 0b91373806786b600d89ccfcfff78fa2f82cb26b
          git clone https://github.com/DSSAT/dssat-csm-data.git /tmp/base-data
          git -C /tmp/base-data checkout 79cb5db71bbca186add92a6a9695866a09c8b51d
          cp -a /tmp/m0-os /tmp/m15-os
          cp -a /tmp/m0-os /tmp/m19-os
      - name: Apply M15 and M19 source patches
        run: |
          set -euo pipefail
          python research/dssat_dtr/dssat485/apply_m15_htemp_patch.py /tmp/m15-os
          python research/dssat_dtr/dssat485/apply_m19_htemp_patch.py /tmp/m19-os
          grep -n 'SUBROUTINE HTEMP_M19' /tmp/m19-os/Weather/HMET.for
          grep -n 'DEC, DOY, ISINB' /tmp/m19-os/Weather/weathr.for
      - name: Build three DSSAT executables
        run: |
          set -euo pipefail
          for V in m0 m15 m19; do
            cmake -S /tmp/${V}-os -B /tmp/${V}-build -DCMAKE_BUILD_TYPE=RELEASE -DCMAKE_INSTALL_PREFIX=/tmp/${V}-run
            cmake --build /tmp/${V}-build --parallel 2
            cmake --install /tmp/${V}-build
            cp -a /tmp/base-data/. /tmp/${V}-run/
            test -x /tmp/${V}-run/dscsm048
          done
      - name: Add identical Anningqu inputs
        run: |
          set -euo pipefail
          for V in m0 m15 m19; do
            R=/tmp/${V}-run
            cp research/dssat_dtr/data/anningqu/formal_ghcn_rain/ANQH2101.WTH "$R/Weather/ANQH2101.WTH"
            cp research/dssat_dtr/data/anningqu/formal_ghcn_rain/ANQH2201.WTH "$R/Weather/ANQH2201.WTH"
            cp research/dssat_dtr/anningqu/AN.SOL "$R/Soil/AN.SOL"
            python research/dssat_dtr/anningqu/build_stageA_propagation_experiments.py "$R/Maize/UFGA8201.MZX" "$R/Maize"
          done
      - name: Run ten scenarios per model
        run: |
          set -euo pipefail
          mkdir -p /tmp/results/M0 /tmp/results/M15 /tmp/results/M19
          SCENS='ANQH2101 ANQH2102 ANQH2103 ANQH2104 ANQH2105 ANQH2201 ANQH2202 ANQH2203 ANQH2204 ANQH2205'
          for SPEC in 'M0:m0' 'M15:m15' 'M19:m19'; do
            LABEL=${SPEC%%:*}; V=${SPEC##*:}
            sudo rm -rf /DSSAT48
            sudo ln -s /tmp/${V}-run /DSSAT48
            cd /tmp/${V}-run/Maize
            for X in $SCENS; do
              rm -f Summary.OUT PlantGro.OUT Evaluate.OUT ERROR.OUT WARNING.OUT
              ../dscsm048 A ${X}.MZX > /tmp/results/${LABEL}/${X}.stdout 2>&1
              test -s Summary.OUT
              test -s PlantGro.OUT
              cp Summary.OUT /tmp/results/${LABEL}/${X}_Summary.OUT
              cp PlantGro.OUT /tmp/results/${LABEL}/${X}_PlantGro.OUT
              if test -s ERROR.OUT; then cat ERROR.OUT; exit 1; fi
            done
          done
      - name: Parse propagation evidence
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import csv,re,statistics,json
          models=['M0','M15','M19']
          scenarios=[f'ANQH{yy}{i:02d}' for yy in ('21','22') for i in range(1,6)]
          dates={1:'Apr21',2:'Apr26',3:'May06',4:'May16',5:'May26'}
          targets=['PDAT','EDAT','ADAT','MDAT','HDAT','CWAM','HWAM','HIAM','LAIX','NDCH','TMAXA','TMINA','SRADA','DAYLA','CRST']
          def parse_summary(path):
              lines=Path(path).read_text(errors='replace').splitlines()
              hi=next(i for i,l in enumerate(lines) if l.startswith('@') and 'RUNNO' in l and 'HWAM' in l)
              header=lines[hi]
              starts=[x.start() for x in re.finditer(r'\S+',header)]
              names=[x.group() for x in re.finditer(r'\S+',header)]
              if names[0]=='@':names=names[1:];starts=starts[1:]
              data=next(l for l in lines[hi+1:] if l.strip() and not l.startswith('!') and not l.startswith('@'))
              out={}
              for j,n in enumerate(names):
                  a=starts[j];b=starts[j+1] if j+1<len(starts) else len(data)
                  out[n]=data[a:b].strip()
              return out
          rows=[]
          for sc in scenarios:
              got={m:parse_summary(f'/tmp/results/{m}/{sc}_Summary.OUT') for m in models}
              yy=2000+int(sc[4:6]);idx=int(sc[6:8])
              r={'scenario':sc,'year':yy,'sowing':dates[idx]}
              for m in models:
                  for k in targets:r[f'{m}_{k}']=got[m].get(k,'')
              for m in ('M15','M19'):
                  for k in ['ADAT','MDAT','CWAM','HWAM','HIAM','LAIX']:
                      try:r[f'{m}_minus_M0_{k}']=float(got[m][k])-float(got['M0'][k])
                      except:r[f'{m}_minus_M0_{k}']=''
              rows.append(r)
          out=Path('research/dssat_dtr/data/anningqu/m19_source_propagation');out.mkdir(parents=True,exist_ok=True)
          with (out/'m0_m15_m19_crop_outputs.csv').open('w',newline='',encoding='utf-8-sig') as f:
              w=csv.DictWriter(f,fieldnames=list(rows[0]));w.writeheader();w.writerows(rows)
          def num(x):
              try:return float(x)
              except:return None
          summary=[]
          for m in ('M15','M19'):
              dy=[num(r[f'{m}_minus_M0_HWAM']) for r in rows];dy=[x for x in dy if x is not None]
              da=[num(r[f'{m}_minus_M0_ADAT']) for r in rows];da=[x for x in da if x is not None]
              dm=[num(r[f'{m}_minus_M0_MDAT']) for r in rows];dm=[x for x in dm if x is not None]
              changed=sum(1 for r in rows if any(abs(num(r.get(f'{m}_minus_M0_{k}')) or 0)>1e-9 for k in ['ADAT','MDAT','CWAM','HWAM','HIAM','LAIX']))
              summary.append({'model':m,'scenarios':len(rows),'changed_scenarios':changed,'mean_delta_yield_kg_ha':statistics.mean(dy),'max_abs_delta_yield_kg_ha':max(abs(x) for x in dy),'mean_delta_anthesis_day':statistics.mean(da),'mean_delta_maturity_day':statistics.mean(dm)})
          with (out/'propagation_summary.csv').open('w',newline='',encoding='utf-8-sig') as f:
              w=csv.DictWriter(f,fieldnames=list(summary[0]));w.writeheader();w.writerows(summary)
          md=['# Source-level DSSAT 4.8.5 M19 crop propagation','',
              'All three arms use identical DSSAT data, Anningqu weather/soil, fixed proxy cultivar IB0035, sowing dates, WATER=N and NITRO=N. Only the HTEMP source differs.','',
              '|Model|Changed scenarios|Mean Δ yield vs M0 (kg/ha)|Max |Δ yield| (kg/ha)|Mean Δ anthesis (d)|Mean Δ maturity (d)|','|---|---:|---:|---:|---:|---:|']
          for s in summary:md.append(f"|{s['model']}|{s['changed_scenarios']}/{s['scenarios']}|{s['mean_delta_yield_kg_ha']:.2f}|{s['max_abs_delta_yield_kg_ha']:.2f}|{s['mean_delta_anthesis_day']:.2f}|{s['mean_delta_maturity_day']:.2f}|")
          md+=['','Interpretation: any reproducible M19-M0 difference establishes source-level propagation from the regional HTEMP correction into CERES-Maize. These proxy-cultivar runs are a mechanism test, not observed-yield validation.']
          (out/'README.md').write_text('\n'.join(md)+'\n',encoding='utf-8');print('\n'.join(md))
          PY
      - name: Upload complete audit outputs
        uses: actions/upload-artifact@v4
        with:
          name: anningqu-m0-m15-m19-${{ github.run_id }}
          path: |
            /tmp/results
            research/dssat_dtr/data/anningqu/m19_source_propagation
          retention-days: 30
      - name: Commit compact propagation evidence
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/dssat_dtr/data/anningqu/m19_source_propagation
          if ! git diff --cached --quiet; then
            git commit -m 'results(dssat): source-level M19 crop propagation'
            git pull --rebase origin research/dssat-regional-dtr-joint-v1
            git push origin HEAD:research/dssat-regional-dtr-joint-v1
          fi

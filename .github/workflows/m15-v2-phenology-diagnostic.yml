name: M15 V2 phenology propagation diagnostic

on:
  push:
    branches: [research/dssat-m15-temp-accuracy-v2]
    paths:
      - 'research/dssat_dtr/scripts/m15_v2_phenology_diagnostic.py'
      - '.github/workflows/m15-v2-phenology-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/dssat-m15-temp-accuracy-v2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build frozen DSSAT arms and run phenology probes
        run: |
          set -euo pipefail
          python research/dssat_dtr/scripts/m15_v2_phenology_diagnostic.py
      - name: Show result
        run: |
          cat research/dssat_dtr/data/m15_temp_v2/phenology_diagnostic/README_M15_V2_PHENOLOGY_DIAGNOSTIC.md
      - name: Commit diagnostic evidence
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/dssat_dtr/data/m15_temp_v2/phenology_diagnostic \
                  research/dssat_dtr/CHECKPOINT_20260830_M15_V2_PHENOLOGY_DIAGNOSTIC_RESULT.md
          if ! git diff --cached --quiet; then
            git commit -m 'Add M15 V2 phenology diagnostic results'
            git pull --rebase origin research/dssat-m15-temp-accuracy-v2
            git push origin HEAD:research/dssat-m15-temp-accuracy-v2
          fi

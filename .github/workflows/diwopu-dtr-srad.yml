name: Screen Diwopu DTR solar-radiation interaction
on:
  push:
    branches: [research/dssat-dtr-matrix]
    paths:
      - 'research/dssat_dtr/scripts/test_diwopu_dtr_srad_interaction.py'
      - '.github/workflows/diwopu-dtr-srad.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  screen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/dssat-dtr-matrix
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet numpy
      - run: python research/dssat_dtr/scripts/test_diwopu_dtr_srad_interaction.py
      - run: |
          cat research/dssat_dtr/data/processed_514635/README_DIWOPU_DTR_SRAD.md
          cat research/dssat_dtr/data/processed_514635/diwopu_highdtr_srad_strata.csv
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/dssat_dtr/data/processed_514635
          if git diff --cached --quiet; then echo 'No changes.'; else git commit -m 'Screen Diwopu DTR radiation interaction'; git push origin HEAD:research/dssat-dtr-matrix; fi

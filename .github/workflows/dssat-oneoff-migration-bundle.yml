name: DSSAT One-off Migration Bundle
on:
  push:
    branches: [research/dssat-regional-dtr-joint-v1]
    paths:
      - '.github/workflows/dssat-oneoff-migration-bundle.yml'
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/dssat-regional-dtr-joint-v1
      - name: Bundle all tracked DSSAT experiment assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/migration/repo_assets
          printf '%s\n' "branch=research/dssat-regional-dtr-joint-v1" "commit=$(git rev-parse HEAD)" > /tmp/migration/BUILD_MANIFEST.txt
          {
            find research/dssat_dtr -type f 2>/dev/null || true
            find repro/windows_dssat_temperature_v1 -type f 2>/dev/null || true
            find .github/workflows -maxdepth 1 -type f \( -iname '*dssat*' -o -iname '*anningqu*' -o -iname '*m15*' -o -iname '*m19*' -o -iname '*m20*' \) 2>/dev/null || true
            find handoff -maxdepth 1 -type f -iname '*dssat*' 2>/dev/null || true
            find results -maxdepth 1 -type f -iname '*dssat*' 2>/dev/null || true
            find scripts -maxdepth 1 -type f -iname '*dssat*' 2>/dev/null || true
          } | sort -u > /tmp/migration/repo_file_list.txt
          while IFS= read -r f; do
            test -f "$f" || continue
            mkdir -p "/tmp/migration/repo_assets/$(dirname "$f")"
            cp -p "$f" "/tmp/migration/repo_assets/$f"
          done < /tmp/migration/repo_file_list.txt
          tar -C /tmp/migration -czf /tmp/dssat_repo_process_archive.tar.gz repo_assets repo_file_list.txt BUILD_MANIFEST.txt
      - name: Fetch frozen official DSSAT dependencies for local execution
        shell: bash
        run: |
          set -euo pipefail
          git clone -q https://github.com/DSSAT/dssat-csm-os.git /tmp/dssat-csm-os
          git -C /tmp/dssat-csm-os checkout -q 0b91373806786b600d89ccfcfff78fa2f82cb26b
          git clone -q https://github.com/DSSAT/dssat-csm-data.git /tmp/dssat-csm-data
          git -C /tmp/dssat-csm-data checkout -q 79cb5db71bbca186add92a6a9695866a09c8b51d
          rm -rf /tmp/dssat-csm-os/.git /tmp/dssat-csm-data/.git
          tar -C /tmp -czf /tmp/dssat485_frozen_dependencies.tar.gz dssat-csm-os dssat-csm-data
      - name: Upload migration bundle only
        uses: actions/upload-artifact@v4
        with:
          name: dssat-oneoff-migration-${{ github.run_id }}
          path: |
            /tmp/dssat_repo_process_archive.tar.gz
            /tmp/dssat485_frozen_dependencies.tar.gz
          retention-days: 7
          if-no-files-found: error

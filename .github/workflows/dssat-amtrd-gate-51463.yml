name: Fit DSSAT-native AMTRD HTEMP gate

on:
  push:
    branches: [research/dssat-dtr-matrix]
    paths:
      - 'research/dssat_dtr/scripts/fit_dssat_internal_amtrd_gate_51463.py'
      - '.github/workflows/dssat-amtrd-gate-51463.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fit-amtrd:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/dssat-dtr-matrix
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fit AMTRD-gated model
        run: python research/dssat_dtr/scripts/fit_dssat_internal_amtrd_gate_51463.py
      - name: Show result
        run: cat research/dssat_dtr/data/processed_51463/README_AMTRD_GATE_HTEMP.md
      - name: Commit result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/dssat_dtr/data/processed_51463/README_AMTRD_GATE_HTEMP.md \
                  research/dssat_dtr/data/processed_51463/amtrd_gate_parameters.csv \
                  research/dssat_dtr/data/processed_51463/amtrd_gate_validation.csv \
                  research/dssat_dtr/data/processed_51463/amtrd_gate_by_dtr.csv \
                  research/dssat_dtr/data/processed_51463/amtrd_gate_by_hour.csv \
                  research/dssat_dtr/data/processed_51463/amtrd_gate_cv_grid.csv
          if ! git diff --cached --quiet; then
            git commit -m 'Add DSSAT-native AMTRD HTEMP results'
            git pull --rebase origin research/dssat-dtr-matrix
            git push origin HEAD:research/dssat-dtr-matrix
          fi

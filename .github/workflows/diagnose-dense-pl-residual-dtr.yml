name: Diagnose calibrated Diwopu DTR residual
on:
  push:
    branches: [research/dssat-dtr-matrix]
    paths:
      - 'research/dssat_dtr/scripts/diagnose_dense_pl_residual_dtr.py'
      - '.github/workflows/diagnose-dense-pl-residual-dtr.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/dssat-dtr-matrix
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet numpy scipy
      - run: python research/dssat_dtr/scripts/diagnose_dense_pl_residual_dtr.py
      - run: |
          cat research/dssat_dtr/data/processed_514635/README_DIWOPU_CALIBRATED_DTR.md
          cat research/dssat_dtr/data/processed_514635/diwopu_calibrated_dtr_bins.csv
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/dssat_dtr/data/processed_514635
          if git diff --cached --quiet; then echo 'No changes.'; else git commit -m 'Diagnose calibrated Diwopu DTR residual'; git push origin HEAD:research/dssat-dtr-matrix; fi

name: Detect main Urumqi 51463 high-DTR Kt breakpoint

on:
  push:
    branches: [research/dssat-dtr-matrix]
    paths:
      - 'research/dssat_dtr/scripts/detect_kt_breakpoint_51463.py'
      - '.github/workflows/kt-breakpoint-51463.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  detect-kt-breakpoint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: research/dssat-dtr-matrix
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Detect Kt breakpoint
        run: python research/dssat_dtr/scripts/detect_kt_breakpoint_51463.py
      - name: Show result
        run: cat research/dssat_dtr/data/processed_51463/README_KT_BREAKPOINT.md
      - name: Commit result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add research/dssat_dtr/data/processed_51463/README_KT_BREAKPOINT.md \
                  research/dssat_dtr/data/processed_51463/kt_breakpoint_results.csv
          git diff --cached --quiet || git commit -m 'Add Kt breakpoint diagnosis'
          git push origin HEAD:research/dssat-dtr-matrix

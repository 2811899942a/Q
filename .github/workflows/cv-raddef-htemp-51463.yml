name: Fit Urumqi 51463 CV radiative-deficit HTEMP

on:
  push:
    branches: [research/dssat-dtr-matrix]
    paths:
      - 'research/dssat_dtr/scripts/fit_cv_radiative_deficit_htemp_51463.py'
      - '.github/workflows/cv-raddef-htemp-51463.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fit-cv-raddef:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: research/dssat-dtr-matrix
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fit CV radiative-deficit model
        run: python research/dssat_dtr/scripts/fit_cv_radiative_deficit_htemp_51463.py
      - name: Show result
        run: cat research/dssat_dtr/data/processed_51463/README_CV_RADDEF_HTEMP.md
      - name: Commit result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add research/dssat_dtr/data/processed_51463/README_CV_RADDEF_HTEMP.md \
                  research/dssat_dtr/data/processed_51463/cv_raddef_kt0_grid.csv \
                  research/dssat_dtr/data/processed_51463/cv_raddef_parameters.csv \
                  research/dssat_dtr/data/processed_51463/cv_raddef_validation.csv \
                  research/dssat_dtr/data/processed_51463/cv_raddef_by_dtr.csv \
                  research/dssat_dtr/data/processed_51463/cv_raddef_by_hour.csv \
                  research/dssat_dtr/data/processed_51463/cv_raddef_by_kt_strata.csv
          git diff --cached --quiet || git commit -m 'Add CV radiative-deficit HTEMP results'
          git push origin HEAD:research/dssat-dtr-matrix

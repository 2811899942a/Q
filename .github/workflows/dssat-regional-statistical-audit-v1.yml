name: DSSAT Regional Statistical Audit V1
on:
  push:
    branches: [research/dssat-regional-dtr-audit-v1]
    paths:
      - '.github/workflows/dssat-regional-statistical-audit-v1.yml'
      - 'research/dssat_dtr/scripts/regional_dtr_statistical_audit_v1.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/dssat-regional-dtr-audit-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy scipy
      - run: python -u research/dssat_dtr/scripts/regional_dtr_statistical_audit_v1.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regional-statistical-audit-${{ github.run_id }}
          path: research/dssat_dtr/data/regional_dtr_statistical_audit_v1/
          retention-days: 30
      - name: Commit audit evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/dssat_dtr/data/regional_dtr_statistical_audit_v1
          if ! git diff --cached --quiet; then
            git commit -m 'results(dssat): formal cohort and beta uncertainty audit'
            git push origin HEAD:research/dssat-regional-dtr-audit-v1
          fi

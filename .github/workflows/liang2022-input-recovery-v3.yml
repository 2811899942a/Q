name: Liang 2022 DSSAT Input Recovery V3

on:
  push:
    branches: [research/dssat-dtr-matrix]
    paths:
      - '.github/workflows/liang2022-input-recovery-v3.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/dssat-dtr-matrix
          fetch-depth: 0

      - name: Recover article through browser challenge
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils >/dev/null
          python -m pip install -q selenium requests
          echo "CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          google-chrome --version 2>/dev/null || chromium --version 2>/dev/null || true
          chromedriver --version 2>/dev/null || true
          mkdir -p /tmp/liang_dl research/dssat_dtr/data/shihezi_real_case/liang2022_input_recovery_v3
          python - <<'PY'
          from pathlib import Path
          import time, requests, json, os, re
          from selenium import webdriver
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import WebDriverWait
          from selenium.webdriver.support import expected_conditions as EC

          ABS='https://www.ggpsxb.com/jgpxxb/ch/reader/view_abstract.aspx?file_no=20220106&flag=1'
          PDF='https://www.ggpsxb.com/jgpxxb/ch/reader/create_pdf.aspx?file_no=20220106&flag=1&quarter_id=1&year_id=2022'
          dl=Path('/tmp/liang_dl')
          opts=webdriver.ChromeOptions()
          opts.add_argument('--headless=new')
          opts.add_argument('--no-sandbox')
          opts.add_argument('--disable-dev-shm-usage')
          opts.add_argument('--disable-gpu')
          opts.add_argument('--window-size=1400,1000')
          opts.add_argument('--user-agent=Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124 Safari/537.36')
          opts.add_experimental_option('prefs', {
              'download.default_directory': str(dl),
              'download.prompt_for_download': False,
              'download.directory_upgrade': True,
              'plugins.always_open_pdf_externally': True,
              'safebrowsing.enabled': True,
          })
          driver=webdriver.Chrome(options=opts)
          status=[]
          try:
              driver.get(ABS)
              WebDriverWait(driver,20).until(EC.presence_of_element_located((By.TAG_NAME,'body')))
              status.append(f'abstract_url={driver.current_url}')
              links=driver.find_elements(By.XPATH,"//a[contains(@href,'create_pdf')]")
              status.append(f'pdf_links={len(links)}')
              href=links[0].get_attribute('href') if links else PDF
              status.append(f'pdf_href={href}')
              if links:
                  driver.execute_script('arguments[0].click();', links[0])
              else:
                  driver.get(PDF)
              # Browser challenge may need several seconds and one or more reloads.
              for _ in range(30):
                  files=[p for p in dl.iterdir() if p.is_file() and not p.name.endswith('.crdownload')]
                  if files:
                      break
                  time.sleep(1)
              files=[p for p in dl.iterdir() if p.is_file() and not p.name.endswith('.crdownload')]
              status.append('downloaded_files='+','.join(f'{p.name}:{p.stat().st_size}' for p in files))
              if not files:
                  # If Chrome opened a challenge/new tab, let it settle, then reuse its browser cookies in requests.
                  if len(driver.window_handles)>1:
                      driver.switch_to.window(driver.window_handles[-1])
                  time.sleep(5)
                  status.append(f'after_click_url={driver.current_url}')
                  status.append('page_head='+driver.page_source[:800].replace('\n',' '))
                  s=requests.Session()
                  ua=driver.execute_script('return navigator.userAgent')
                  s.headers.update({'User-Agent':ua,'Referer':ABS})
                  for c in driver.get_cookies():
                      s.cookies.set(c['name'],c['value'],domain=c.get('domain') or 'www.ggpsxb.com',path=c.get('path','/'))
                  r=s.get(PDF,timeout=30,allow_redirects=True)
                  status.append(f'requests_status={r.status_code} bytes={len(r.content)} ctype={r.headers.get("content-type","")}')
                  status.append('requests_head='+r.content[:120].decode('latin-1','replace').replace('\n',' '))
                  if r.content.startswith(b'%PDF'):
                      (dl/'liang2022.pdf').write_bytes(r.content)
                      files=[dl/'liang2022.pdf']
              # Final fallback: navigate directly after cookies/challenge execution and wait again.
              if not files:
                  driver.get(PDF)
                  time.sleep(10)
                  files=[p for p in dl.iterdir() if p.is_file() and not p.name.endswith('.crdownload')]
                  status.append(f'direct_url={driver.current_url}')
                  status.append('direct_head='+driver.page_source[:800].replace('\n',' '))
                  status.append('direct_files='+','.join(f'{p.name}:{p.stat().st_size}' for p in files))
          finally:
              cookies=[]
              try: cookies=[{'name':c['name'],'domain':c.get('domain','')} for c in driver.get_cookies()]
              except Exception: pass
              status.append('cookie_names='+','.join(c['name'] for c in cookies))
              driver.quit()
          Path('/tmp/liang_status.txt').write_text('\n'.join(status)+'\n',encoding='utf-8')
          print('\n'.join(status))
          files=[p for p in dl.iterdir() if p.is_file() and not p.name.endswith('.crdownload')]
          pdf=None
          for p in files:
              b=p.read_bytes()[:5]
              if b.startswith(b'%PDF'):
                  pdf=p; break
          if pdf is None:
              raise SystemExit('Browser retrieval did not produce a PDF')
          Path('/tmp/liang_article.pdf').write_bytes(pdf.read_bytes())
          print('PDF_OK',pdf,pdf.stat().st_size)
          PY
          pdftotext -layout /tmp/liang_article.pdf /tmp/liang_article.txt
          python - <<'PY'
          from pathlib import Path
          import re
          text=Path('/tmp/liang_article.txt').read_text(errors='replace')
          lines=text.splitlines()
          kws=['试验区','试验地','施肥','肥料','氮肥','尿素','磷肥','钾肥','基肥','追肥','氮素','初始含水','初始土壤','初始水分','土壤含水','土壤水分','气象','气象站','国家气象','NASA','51356','石河子站','播种','密度','株距','行距','灌水','产量','DSSAT','CERES','GLUE','P1','P2','P5','G2','G3','PHINT']
          hits=[]
          hit_lines=[]
          for i,line in enumerate(lines):
              found=[k for k in kws if k.lower() in line.lower()]
              if found:
                  block='\n'.join(lines[max(0,i-3):min(len(lines),i+4)]).strip()
                  if block and block not in hits: hits.append(block)
                  hit_lines.append((i+1,found,line.strip()))
          out=Path('research/dssat_dtr/data/shihezi_real_case/liang2022_input_recovery_v3')
          out.mkdir(parents=True,exist_ok=True)
          (out/'input_keyword_context.txt').write_text('\n\n---\n\n'.join(hits),encoding='utf-8')
          status=Path('/tmp/liang_status.txt').read_text(encoding='utf-8')
          summary=['# Liang et al. 2022 DSSAT input recovery V3','',
                   'Article: 梁永辉等, 基于CERES-Maize模型的新疆滴灌玉米灌溉制度优化, 灌溉排水学报 2022, 41(1):41-48, DOI 10.13522/j.cnki.ggps.2021337.','',
                   f'- Browser retrieval and temporary text extraction succeeded: {len(lines)} text lines.',
                   '- Full copyrighted PDF is not committed; only input-relevant context and retrieval audit are stored.','',
                   '## Browser audit','```',status.rstrip(),'```','','## Keyword counts']
          for k in kws:
              summary.append(f'- {k}: {sum(1 for line in lines if k.lower() in line.lower())}')
          summary += ['','## Input-relevant hit lines']
          for n,found,line in hit_lines[:160]:
              summary.append(f'- L{n} [{"/".join(found)}] {line}')
          (out/'README.md').write_text('\n'.join(summary)+'\n',encoding='utf-8')
          print('\n'.join(summary[:120]))
          print('\n===== FILTERED CONTEXT =====')
          print(('\n\n---\n\n'.join(hits))[:60000])
          PY

      - name: Commit recovered input context
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/dssat_dtr/data/shihezi_real_case/liang2022_input_recovery_v3
          if ! git diff --cached --quiet; then
            git commit -m 'Recover Liang 2022 DSSAT input context via browser'
            git pull --rebase origin research/dssat-dtr-matrix
            git push origin HEAD:research/dssat-dtr-matrix
          fi

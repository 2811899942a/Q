name: Fit Urumqi 51463 CV nonlinear radiative-deficit HTEMP

on:
  push:
    branches: [research/dssat-dtr-matrix]
    paths:
      - 'research/dssat_dtr/scripts/fit_cv_cloud_deficit_power_htemp_51463.py'
      - '.github/workflows/cv-clouddef-power-htemp-51463.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fit-cv-clouddef:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: research/dssat-dtr-matrix
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fit nonlinear radiative-deficit model
        run: python research/dssat_dtr/scripts/fit_cv_cloud_deficit_power_htemp_51463.py
      - name: Show result
        run: cat research/dssat_dtr/data/processed_51463/README_CV_CLOUDDEF_POWER_HTEMP.md
      - name: Commit result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add research/dssat_dtr/data/processed_51463/README_CV_CLOUDDEF_POWER_HTEMP.md \
                  research/dssat_dtr/data/processed_51463/cv_clouddef_power_grid.csv \
                  research/dssat_dtr/data/processed_51463/cv_clouddef_power_parameters.csv \
                  research/dssat_dtr/data/processed_51463/cv_clouddef_power_validation.csv \
                  research/dssat_dtr/data/processed_51463/cv_clouddef_power_by_dtr.csv \
                  research/dssat_dtr/data/processed_51463/cv_clouddef_power_by_hour.csv \
                  research/dssat_dtr/data/processed_51463/cv_clouddef_power_by_kt_strata.csv
          if git diff --cached --quiet; then
            echo 'No result changes.'
          else
            git commit -m 'Add CV nonlinear radiative-deficit HTEMP results'
            git pull --rebase origin research/dssat-dtr-matrix
            git push origin HEAD:research/dssat-dtr-matrix
          fi

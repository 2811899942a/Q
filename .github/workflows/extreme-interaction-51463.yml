name: Diagnose Urumqi temperature-extreme interaction

on:
  push:
    branches: [research/dssat-dtr-matrix]
    paths:
      - 'research/dssat_dtr/scripts/test_extreme_interaction_51463.py'
      - '.github/workflows/extreme-interaction-51463.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/dssat-dtr-matrix
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python research/dssat_dtr/scripts/test_extreme_interaction_51463.py
      - run: cat research/dssat_dtr/data/processed_51463/README_EXTREME_INTERACTION.md
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/dssat_dtr/data/processed_51463
          if git diff --cached --quiet; then echo 'No changes.'; else git commit -m 'Diagnose hot cold interactions beyond DTR'; git push origin HEAD:research/dssat-dtr-matrix; fi

name: Validate Diwopu DTR-regime Parton-Logan
on:
  push:
    branches: [research/dssat-dtr-matrix]
    paths:
      - 'research/dssat_dtr/scripts/test_diwopu_dtr_regime_pl.py'
      - '.github/workflows/diwopu-dtr-regime-pl.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/dssat-dtr-matrix
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet numpy scipy
      - run: python research/dssat_dtr/scripts/test_diwopu_dtr_regime_pl.py
      - run: |
          cat research/dssat_dtr/data/processed_514635/README_DIWOPU_REGIME_PL.md
          echo '--- parameters ---'
          cat research/dssat_dtr/data/processed_514635/diwopu_regime_pl_parameters.csv
          echo '--- validation ---'
          cat research/dssat_dtr/data/processed_514635/diwopu_regime_pl_validation.csv
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/dssat_dtr/data/processed_514635
          if git diff --cached --quiet; then echo 'No changes.'; else git commit -m 'Validate Diwopu DTR-regime Parton-Logan'; git push origin HEAD:research/dssat-dtr-matrix; fi

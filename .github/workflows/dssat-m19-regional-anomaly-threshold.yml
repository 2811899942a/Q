name: DSSAT M19 Regional Anomaly Threshold
on:
  push:
    branches: [research/dssat-regional-dtr-joint-v1]
    paths:
      - 'research/dssat_dtr/scripts/m19_regional_anomaly_threshold.py'
      - '.github/workflows/dssat-m19-regional-anomaly-threshold.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  experiment:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/dssat-regional-dtr-joint-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy scipy
      - name: Run M19 threshold screen
        run: python -u research/dssat_dtr/scripts/m19_regional_anomaly_threshold.py
      - name: Show M19 evidence
        if: always()
        run: |
          cat research/dssat_dtr/data/m19_regional_anomaly_threshold/README.md || true
          cat research/dssat_dtr/data/m19_regional_anomaly_threshold/parameters.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dssat-m19-threshold-${{ github.run_id }}
          path: research/dssat_dtr/data/m19_regional_anomaly_threshold/
          retention-days: 30
      - name: Commit M19 evidence
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/dssat_dtr/data/m19_regional_anomaly_threshold
          if ! git diff --cached --quiet; then
            git commit -m 'results(dssat): M19 regional anomaly threshold screen'
            git pull --rebase origin research/dssat-regional-dtr-joint-v1
            git push origin HEAD:research/dssat-regional-dtr-joint-v1
          fi

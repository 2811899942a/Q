name: Build Urumqi 51463 NOAA dataset

on:
  push:
    branches:
      - research/dssat-dtr-matrix
    paths:
      - 'research/dssat_dtr/scripts/process_noaa_51463.py'
      - 'research/dssat_dtr/scripts/process_ghcn_51463.py'
      - 'research/dssat_dtr/scripts/benchmark_dssat_htemp_51463.py'
      - 'research/dssat_dtr/scripts/calibrate_pl_xj_51463.py'
      - 'research/dssat_dtr/scripts/analyze_dtr_asymmetry_51463.py'
      - '.github/workflows/build-urumqi-51463-data.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: research/dssat-dtr-matrix

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download and process NOAA Global Hourly station 51463099999
        env:
          START_YEAR: '2000'
          END_YEAR: '2024'
        run: python research/dssat_dtr/scripts/process_noaa_51463.py

      - name: Download GHCN Daily and merge formal Tmax Tmin DTR
        env:
          START_YEAR: '2000'
          END_YEAR: '2024'
        run: python research/dssat_dtr/scripts/process_ghcn_51463.py

      - name: Benchmark original DSSAT HTEMP
        run: python research/dssat_dtr/scripts/benchmark_dssat_htemp_51463.py

      - name: Calibrate PL-XJ and run independent validation
        run: python research/dssat_dtr/scripts/calibrate_pl_xj_51463.py

      - name: Diagnose DTR-driven residual asymmetry and temperature extremes
        run: python research/dssat_dtr/scripts/analyze_dtr_asymmetry_51463.py

      - name: Show scientific summaries
        run: |
          cat research/dssat_dtr/data/processed_51463/README_HTEMP_BASELINE.md
          echo '--- PL-XJ independent validation ---'
          cat research/dssat_dtr/data/processed_51463/README_PL_XJ_CALIBRATION.md
          echo '--- DTR asymmetry mechanism diagnosis ---'
          cat research/dssat_dtr/data/processed_51463/README_DTR_ASYMMETRY.md
          echo '--- DTR asymmetry bins ---'
          cat research/dssat_dtr/data/processed_51463/dtr_asymmetry_by_bin.csv
          echo '--- extreme temperature diagnostics ---'
          cat research/dssat_dtr/data/processed_51463/extreme_temperature_diagnostics.csv

      - name: Commit processed data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/dssat_dtr/data/processed_51463
          if git diff --cached --quiet; then
            echo 'No processed-data changes to commit.'
          else
            git commit -m 'Diagnose Urumqi DTR asymmetry and temperature extremes'
            git push origin HEAD:research/dssat-dtr-matrix
          fi

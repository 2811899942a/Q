name: Build Urumqi 51463 NOAA dataset

on:
  push:
    branches:
      - research/dssat-dtr-matrix
    paths:
      - 'research/dssat_dtr/scripts/process_noaa_51463.py'
      - '.github/workflows/build-urumqi-51463-data.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: research/dssat-dtr-matrix

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download and process NOAA station 51463099999
        env:
          START_YEAR: '2000'
          END_YEAR: '2024'
        run: python research/dssat_dtr/scripts/process_noaa_51463.py

      - name: Show QC summary
        run: |
          cat research/dssat_dtr/data/processed_51463/README_QC.md
          echo '--- yearly QC head ---'
          head -30 research/dssat_dtr/data/processed_51463/51463099999_yearly_qc_2000_2024.csv

      - name: Commit processed data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/dssat_dtr/data/processed_51463
          if git diff --cached --quiet; then
            echo 'No processed-data changes to commit.'
          else
            git commit -m 'Build NOAA 51463 processed hourly and DTR QC data'
            git push origin HEAD:research/dssat-dtr-matrix
          fi

name: DSSAT M20 Windows Reproduction
on:
  workflow_dispatch:
  push:
    branches: [research/dssat-regional-dtr-joint-v1]
    paths:
      - 'repro/windows_dssat_temperature_v1/run_m20_bridge.ps1'
      - 'repro/windows_dssat_temperature_v1/run_full_crop_ab.ps1'
      - 'repro/windows_dssat_temperature_v1/environment_check.ps1'
      - 'research/dssat_dtr/dssat485/apply_m19_htemp_patch_2call.py'
      - 'research/dssat_dtr/dssat485/apply_m20_dtt_bridge_patch.py'
      - 'research/dssat_dtr/scripts/build_controlled_dtr_weather.py'
      - 'research/dssat_dtr/scripts/parse_m0_m19_m20_bridge.py'
      - '.github/workflows/dssat-m20-windows-repro.yml'
permissions:
  contents: read
jobs:
  windows-repro:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/dssat-regional-dtr-joint-v1
      - name: Install MinGW Fortran toolchain
        shell: pwsh
        run: |
          choco install mingw -y --no-progress
          $mingw = 'C:\ProgramData\mingw64\mingw64\bin'
          if (Test-Path $mingw) {
            $mingw | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
      - name: Inspect Windows build environment
        shell: pwsh
        run: |
          $paths = @(
            'C:\ProgramData\mingw64\mingw64\bin',
            'C:\tools\mingw64\bin',
            'C:\ProgramData\chocolatey\bin'
          )
          foreach ($p in $paths) { if (Test-Path $p) { $env:PATH = "$p;$env:PATH" } }
          Get-Command gfortran -ErrorAction Stop
          Get-Command mingw32-make -ErrorAction Stop
          .\repro\windows_dssat_temperature_v1\environment_check.ps1
      - name: Run full M0 M19 M20 Windows reproduction
        shell: pwsh
        run: |
          $paths = @(
            'C:\ProgramData\mingw64\mingw64\bin',
            'C:\tools\mingw64\bin',
            'C:\ProgramData\chocolatey\bin'
          )
          foreach ($p in $paths) { if (Test-Path $p) { $env:PATH = "$p;$env:PATH" } }
          $work = 'D:\dssat_m20_repro'
          .\repro\windows_dssat_temperature_v1\run_m20_bridge.ps1 -RepoRoot (Get-Location).Path -WorkRoot $work -BuildJobs 2 -KeepWork
      - name: Show compact Windows results
        if: always()
        shell: pwsh
        run: |
          $compact='D:\dssat_m20_repro\compact_results'
          if (Test-Path (Join-Path $compact 'bridge_summary.csv')) {
            Get-Content (Join-Path $compact 'bridge_summary.csv')
          }
          if (Test-Path (Join-Path $compact 'manifest.json')) {
            Get-Content (Join-Path $compact 'manifest.json')
          }
      - name: Upload Windows audit outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dssat-m20-windows-${{ github.run_id }}
          path: |
            D:\dssat_m20_repro\compact_results
            D:\dssat_m20_repro\results
          if-no-files-found: warn
          retention-days: 30

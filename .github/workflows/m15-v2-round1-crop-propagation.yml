name: M15 V2 round1 crop propagation

on:
  push:
    branches: [research/dssat-m15-temp-accuracy-v2]
    paths:
      - 'research/dssat_dtr/scripts/m15_v2_round1_crop_propagation.py'
      - '.github/workflows/m15-v2-round1-crop-propagation.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  crop:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/dssat-m15-temp-accuracy-v2
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build four DSSAT arms and run frozen Shihezi crop cases
        run: |
          set -euo pipefail
          python research/dssat_dtr/scripts/m15_v2_round1_crop_propagation.py

      - name: Show crop result
        run: |
          cat research/dssat_dtr/data/m15_temp_v2/crop_propagation_round1/README_M15_V2_ROUND1_CROP_PROPAGATION.md

      - name: Commit crop evidence
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/dssat_dtr/data/m15_temp_v2/crop_propagation_round1 \
                  research/dssat_dtr/CHECKPOINT_20260830_M15_V2_ROUND1_CROP_PROPAGATION_RESULT.md
          if ! git diff --cached --quiet; then
            git commit -m 'Add M15 V2 round1 crop propagation results'
            git pull --rebase origin research/dssat-m15-temp-accuracy-v2
            git push origin HEAD:research/dssat-m15-temp-accuracy-v2
          fi

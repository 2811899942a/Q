name: DSSAT M17 Regional Radiative Warp
on:
  push:
    branches: [research/dssat-regional-dtr-joint-v1]
    paths:
      - 'research/dssat_dtr/scripts/m17_regional_radiative_monotonic_warp.py'
      - '.github/workflows/dssat-m17-regional-radwarp.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  screen:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/dssat-regional-dtr-joint-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy scipy
      - name: Run preregistered M17 screen
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile research/dssat_dtr/scripts/m17_regional_radiative_monotonic_warp.py
          python -u research/dssat_dtr/scripts/m17_regional_radiative_monotonic_warp.py
      - name: Show result
        if: always()
        run: cat research/dssat_dtr/data/m17_regional_radwarp/README.md || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dssat-m17-regional-radwarp-${{ github.run_id }}
          path: research/dssat_dtr/data/m17_regional_radwarp/
          retention-days: 30
      - name: Commit evidence
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/dssat_dtr/data/m17_regional_radwarp
          if ! git diff --cached --quiet; then
            git commit -m 'results(dssat): M17 regional radiative monotonic warp'
            git push origin HEAD:research/dssat-regional-dtr-joint-v1
          fi

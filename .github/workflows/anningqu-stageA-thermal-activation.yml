name: Analyze Anningqu M15 thermal activation
on:
  push:
    branches: [research/dssat-dtr-matrix]
    paths:
      - 'research/dssat_dtr/anningqu/analyze_stageA_m15_thermal_activation.py'
      - '.github/workflows/anningqu-stageA-thermal-activation.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/dssat-dtr-matrix
      - run: python research/dssat_dtr/anningqu/analyze_stageA_m15_thermal_activation.py
      - run: cat research/dssat_dtr/data/anningqu/stageA_thermal_activation/README_STAGEA_THERMAL_ACTIVATION.md
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/dssat_dtr/data/anningqu/stageA_thermal_activation
          if ! git diff --cached --quiet; then
            git commit -m 'Add Anningqu M15 thermal activation results'
            git pull --rebase origin research/dssat-dtr-matrix
            git push origin HEAD:research/dssat-dtr-matrix
          fi
